<title>Bussola della Cittadinanza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<style>
/* ============================================================
   Bussola della Cittadinanza — foglio di stile
   Direzione: cartografia civica britannica.
   Fondo carta, inchiostro blu notte, rosso araldico come accento.
   ============================================================ */

:root {
  /* --- neutri: grigi con una punta di verde-blu, non grigi di sistema --- */
  --paper:      #E9EDE7;
  --paper-2:    #DFE5DD;
  --surface:    #FAFBF8;
  --surface-2:  #FFFFFF;
  --ink:        #14202E;
  --ink-2:      #55647A;
  --ink-3:      #808F9F;
  --line:       #C7D0C8;
  --line-soft:  #DCE2DA;
  --graticule:  #D4DCD3;

  /* --- accenti --- */
  --accent:     #A81D26;   /* rosso araldico */
  --accent-ink: #FFFFFF;
  --good:       #1E5C4F;   /* verde mappa: studiato */
  --gold:       #8A6A16;   /* avvisi */
  --gold-bg:    #F6EFDB;

  /* --- colori delle nove aree (legenda di mappa) --- */
  --c-percorso: #1F3E6E;
  --c-test:     #A81D26;
  --c-inglese:  #1B6B63;
  --c-ch1:      #6B3A6E;
  --c-ch2:      #3D6B2E;
  --c-ch3:      #8A5A17;
  --c-ch4:      #A03A5C;
  --c-ch5:      #2A5680;
  --c-news:     #7A6410;

  --shadow-sm: 0 1px 2px rgba(20,32,46,.10), 0 2px 6px rgba(20,32,46,.06);
  --shadow-md: 0 4px 14px rgba(20,32,46,.12), 0 12px 32px rgba(20,32,46,.10);
  --shadow-lg: 0 8px 24px rgba(20,32,46,.16), 0 24px 60px rgba(20,32,46,.16);

  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 14px;
  --header-h: 60px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:      #0C1219;
    --paper-2:    #0A1017;
    --surface:    #141E29;
    --surface-2:  #1A2632;
    --ink:        #E5EDF4;
    --ink-2:      #9CADBE;
    --ink-3:      #718294;
    --line:       #27333F;
    --line-soft:  #1E2A35;
    --graticule:  #18222C;
    --accent:     #E4757C;
    --accent-ink: #1A0508;
    --good:       #5FBBA1;
    --gold:       #D8AE5C;
    --gold-bg:    #241E0E;
    --c-percorso: #7CA3DE;
    --c-test:     #E4757C;
    --c-inglese:  #57BDB1;
    --c-ch1:      #C193C6;
    --c-ch2:      #8CC377;
    --c-ch3:      #DBA659;
    --c-ch4:      #E48BA8;
    --c-ch5:      #7FB3E0;
    --c-news:     #CFB84A;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-md: 0 4px 14px rgba(0,0,0,.45), 0 12px 32px rgba(0,0,0,.35);
    --shadow-lg: 0 8px 24px rgba(0,0,0,.5), 0 24px 60px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --paper:      #0C1219;
  --paper-2:    #0A1017;
  --surface:    #141E29;
  --surface-2:  #1A2632;
  --ink:        #E5EDF4;
  --ink-2:      #9CADBE;
  --ink-3:      #718294;
  --line:       #27333F;
  --line-soft:  #1E2A35;
  --graticule:  #18222C;
  --accent:     #E4757C;
  --accent-ink: #1A0508;
  --good:       #5FBBA1;
  --gold:       #D8AE5C;
  --gold-bg:    #241E0E;
  --c-percorso: #7CA3DE;
  --c-test:     #E4757C;
  --c-inglese:  #57BDB1;
  --c-ch1:      #C193C6;
  --c-ch2:      #8CC377;
  --c-ch3:      #DBA659;
  --c-ch4:      #E48BA8;
  --c-ch5:      #7FB3E0;
  --c-news:     #CFB84A;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 4px 14px rgba(0,0,0,.45), 0 12px 32px rgba(0,0,0,.35);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.5), 0 24px 60px rgba(0,0,0,.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  overscroll-behavior: none;
}

button { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

/* ============================ INTELAIATURA ============================ */

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

/* ------------------------------ testata ------------------------------ */

.bar {
  flex: none;
  height: var(--header-h);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 40;
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 9px;
  min-width: 0;
  margin-right: auto;
}

.brand h1 {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.brand .sub {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-3);
  white-space: nowrap;
}

@media (max-width: 720px) { .brand .sub { display: none; } }
@media (max-width: 460px) {
  .bar { padding: 0 10px; gap: 7px; }
  .tools { gap: 5px; }
  #view-toggle span { display: none; }
  .brand h1 { font-size: 18px; }
}

.tools { display: flex; align-items: center; gap: 6px; flex: none; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 34px;
  min-width: 34px;
  padding: 0 10px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-2);
  transition: background .15s, color .15s, border-color .15s;
  white-space: nowrap;
}
.btn:hover { background: var(--paper-2); color: var(--ink); }
.btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* selettore di lingua a due stati */
.lang {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  overflow: hidden;
  background: var(--surface-2);
  flex: none;
}
.lang button {
  border: 0;
  background: transparent;
  height: 34px;
  padding: 0 11px;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: .06em;
  color: var(--ink-3);
}
.lang button + button { border-left: 1px solid var(--line); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

/* ------------------------------ ricerca ------------------------------ */

.search { position: relative; flex: none; }
.search input {
  height: 34px;
  width: 190px;
  max-width: 34vw;
  padding: 0 10px 0 30px;
  font: inherit;
  font-size: 13px;
  color: var(--ink);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
}
.search input::placeholder { color: var(--ink-3); }
.search svg {
  position: absolute; left: 9px; top: 9px;
  width: 15px; height: 15px;
  stroke: var(--ink-3); fill: none; stroke-width: 1.8;
  pointer-events: none;
}
@media (max-width: 560px) { .search input { width: 40px; padding-left: 28px; } .search input:focus { width: 55vw; } }

.results {
  position: absolute;
  top: 40px; right: 0;
  width: min(360px, 82vw);
  max-height: 60vh;
  overflow-y: auto;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg);
  padding: 6px;
  z-index: 60;
}
.results:empty { display: none; }
.results button {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  padding: 8px 10px;
  border-radius: var(--r-md);
  cursor: pointer;
}
.results button:hover, .results button:focus-visible { background: var(--paper); }
.results .rt { font-weight: 600; font-size: 13.5px; }
.results .rc { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); }
.results .rl { font-size: 12px; color: var(--ink-2); display: block; margin-top: 1px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* --------------------------- barra progresso --------------------------- */

.progress {
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 2px;
  background: transparent;
}
.progress i {
  display: block; height: 100%;
  background: var(--good);
  transition: width .3s ease;
}

/* ============================== LA MAPPA ============================== */

.stage { position: relative; flex: 1; min-height: 0; }

.viewport {
  position: absolute; inset: 0;
  overflow: hidden;
  cursor: grab;
  touch-action: none;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--graticule) 1px, transparent 1px),
    linear-gradient(90deg, var(--graticule) 1px, transparent 1px);
  background-size: 64px 64px;
}
.viewport.grabbing { cursor: grabbing; }
.viewport.hidden { display: none; }

.world {
  position: absolute;
  top: 0; left: 0;
  width: 2800px; height: 2800px;
  transform-origin: 0 0;
  will-change: transform;
}

.links { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.links path {
  fill: none;
  stroke: var(--line);
  stroke-width: 2.5;
  stroke-linecap: round;
  transition: stroke .25s, stroke-width .25s;
}
.links path.on { stroke: var(--edge, var(--ink-3)); stroke-width: 3.5; opacity: .85; }
.links path.casing { stroke: var(--paper); stroke-width: 7; opacity: .9; }

/* --------------------------- nodi della mappa --------------------------- */

.node {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 1px;
  text-align: left;
  background: var(--surface-2);
  border: 1.5px solid var(--line);
  border-radius: var(--r-lg);
  padding: 8px 11px;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .18s, border-color .18s, transform .18s;
}
.node:hover { box-shadow: var(--shadow-md); }
.node .code {
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: .08em;
  color: var(--hue, var(--ink-3));
  font-weight: 500;
}
.node .name {
  font-size: 13px;
  font-weight: 500;
  line-height: 1.28;
  color: var(--ink);
  letter-spacing: -0.005em;
}
.node.leaf { width: 172px; }
@media (max-width: 760px) {
  .node.leaf { width: 152px; }
  .node.hub { width: 172px; }
  .node.root { width: 200px; }
}
.node.leaf .name { font-size: 12.5px; }

.node.hub {
  width: 196px;
  padding: 11px 13px 12px;
  border-color: var(--hue);
  border-width: 2px;
  background: var(--surface-2);
}
.node.hub .name { font-family: var(--font-display); font-size: 17px; font-weight: 600; line-height: 1.2; }
.node.hub .count {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-3);
  margin-top: 3px;
}

.node.root {
  width: 232px;
  padding: 16px 18px;
  border: 2px solid var(--ink);
  background: var(--ink);
  color: var(--surface);
  border-radius: 18px;
}
.node.root .name { font-family: var(--font-display); font-size: 21px; font-weight: 600; color: var(--surface); line-height: 1.15; }
.node.root .code { color: var(--surface); opacity: .55; }

.node.active { border-color: var(--accent); box-shadow: var(--shadow-md), 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.node.dim { opacity: .28; }
.node.done .name { color: var(--ink-2); }

.node .tick {
  position: absolute;
  top: -7px; right: -7px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--good);
  color: #fff;
  display: none;
  align-items: center; justify-content: center;
  font-size: 11px; line-height: 1;
  box-shadow: 0 0 0 2px var(--paper);
}
.node.done .tick { display: flex; }

.node.appear { animation: pop .26s cubic-bezier(.2,.9,.3,1.2) backwards; }
@keyframes pop { from { opacity: 0; transform: translate(-50%,-50%) scale(.7); } }

@media (prefers-reduced-motion: reduce) {
  .node, .links path { transition: none; }
  .node.appear { animation: none; }
}

/* ---------------------------- comandi mappa ---------------------------- */

.zoom {
  position: absolute;
  left: 14px; bottom: 14px;
  display: flex;
  flex-direction: column;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  z-index: 20;
}
.zoom button {
  width: 38px; height: 36px;
  border: 0; background: transparent; cursor: pointer;
  display: grid; place-items: center;
  color: var(--ink-2);
}
.zoom button + button { border-top: 1px solid var(--line-soft); }
.zoom button:hover { background: var(--paper); color: var(--ink); }
.zoom svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.hint {
  position: absolute;
  left: 62px; bottom: 18px;
  padding: 4px 9px;
  background: color-mix(in srgb, var(--paper) 82%, transparent);
  border-radius: 20px;
  transition: opacity .35s ease;
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: .04em;
  color: var(--ink-3);
  pointer-events: none;
  z-index: 15;
  max-width: 46vw;
}
@media (max-width: 640px) { .hint { display: none; } }

/* ============================= INDICE (lista) ============================= */

.outline {
  position: absolute; inset: 0;
  overflow-y: auto;
  background: var(--paper);
  padding: 26px 20px 80px;
  -webkit-overflow-scrolling: touch;
}
.outline.hidden { display: none; }
.outline .wrap { max-width: 940px; margin: 0 auto; }

.outline .intro {
  font-family: var(--font-display);
  font-size: clamp(15.5px, 1.4vw + 12px, 19px);
  line-height: 1.5;
  color: var(--ink-2);
  max-width: 60ch;
  margin: 0 0 30px;
}
.outline .intro em { color: var(--ink); font-style: italic; }

.branchcard {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 4px solid var(--hue);
  border-radius: var(--r-lg);
  padding: 16px 18px;
  margin-bottom: 14px;
}
.branchcard > h2 {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 600;
  margin: 0 0 2px;
  text-wrap: balance;
}
.branchtitle {
  border: 0;
  background: none;
  padding: 0;
  font: inherit;
  color: inherit;
  cursor: pointer;
  text-align: left;
  border-bottom: 2px solid transparent;
}
.branchtitle:hover { border-bottom-color: var(--hue); }
.branchcard > p {
  margin: 0 0 12px;
  color: var(--ink-2);
  font-size: 14px;
  max-width: 62ch;
}
.branchcard .eyebrow {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--hue);
  display: block;
  margin-bottom: 4px;
}
.olist { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.olist button {
  display: flex; align-items: baseline; gap: 8px;
  text-align: left;
  border: 1px solid var(--line-soft);
  background: var(--surface-2);
  border-radius: var(--r-md);
  padding: 9px 11px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.olist button:hover { border-color: var(--hue); background: var(--paper); }
.olist .c { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); flex: none; }
.olist .n { font-size: 13.5px; font-weight: 500; line-height: 1.3; }
.olist button.done .n { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--good); }

/* ============================== PANNELLO ============================== */

.panel {
  position: absolute;
  z-index: 50;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
}
.panel[hidden] { display: none; }

@media (min-width: 900px) {
  .panel {
    top: 12px; right: 12px; bottom: 12px;
    width: 430px;
    border-radius: var(--r-lg);
    animation: slidein .22s ease;
  }
  @keyframes slidein { from { opacity: 0; transform: translateX(18px); } }
}
@media (max-width: 899px) {
  .panel {
    left: 0; right: 0; bottom: 0;
    max-height: 82dvh;
    border-radius: 18px 18px 0 0;
    border-bottom: 0;
    animation: sheetin .24s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes sheetin { from { transform: translateY(20%); opacity: .4; } }
}
@media (prefers-reduced-motion: reduce) { .panel { animation: none; } }

.panel { touch-action: pan-y; }
.grip { display: none; }
@media (max-width: 899px) {
  .grip {
    display: block;
    width: 38px; height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin: 8px auto 0;
    flex: none;
  }
}

.phead {
  flex: none;
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--line-soft);
  position: relative;
}
.phead .eyebrow {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--hue, var(--ink-3));
  display: flex; align-items: center; gap: 7px;
  margin-bottom: 6px;
}
.phead .eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hue, var(--ink-3)); flex: none; }
.phead h2 {
  font-family: var(--font-display);
  font-size: 25px;
  font-weight: 600;
  line-height: 1.15;
  margin: 0 34px 6px 0;
  letter-spacing: -0.015em;
  text-wrap: balance;
}
.phead .alt {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 15px;
  color: var(--ink-3);
  margin: 0 0 8px;
}
.phead .lead {
  margin: 0;
  font-size: 14.5px;
  color: var(--ink-2);
  max-width: 46ch;
}
.close {
  position: absolute; top: 12px; right: 12px;
  width: 30px; height: 30px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  border-radius: 50%;
  cursor: pointer;
  display: grid; place-items: center;
  color: var(--ink-2);
}
.close:hover { background: var(--paper-2); color: var(--ink); }
.close svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; }

.pbody {
  flex: 1;
  overflow-y: auto;
  padding: 14px 18px 20px;
  -webkit-overflow-scrolling: touch;
}

.pbody p { margin: 0 0 12px; font-size: 14.5px; max-width: 48ch; }
.pbody strong { font-weight: 600; }
.pbody em { font-style: italic; }

.pbody ul { margin: 0 0 14px; padding: 0; list-style: none; display: grid; gap: 9px; }
.pbody ul li {
  position: relative;
  padding-left: 17px;
  font-size: 14px;
  max-width: 48ch;
}
.pbody ul li::before {
  content: "";
  position: absolute;
  left: 2px; top: 8px;
  width: 6px; height: 6px;
  border-radius: 1px;
  background: var(--hue, var(--ink-3));
  transform: rotate(45deg);
}

.kv { display: grid; gap: 0; margin: 0 0 14px; border-top: 1px solid var(--line-soft); }
.kv > div {
  display: grid;
  grid-template-columns: 118px 1fr;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line-soft);
  font-size: 13.5px;
}
.kv dt, .kv .k {
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.5;
  letter-spacing: .01em;
  color: var(--ink-3);

  t: { it: "Doppia cittadinanza IT/UK", en: "Dual Italian/British citizenship" },
  lead: { it: "L'Italia non ti fa perdere la cittadinanza: diventi britannico e resti italiano. Ma l'AIRE va aggiornata.", en: "Italy does not take your citizenship away: you become British and stay Italian. But your AIRE registration must be updated." },
  body: [
    { p: {
      it: "La <strong>legge 91/1992</strong> ammette la doppia cittadinanza: acquisire volontariamente quella britannica <strong>non fa perdere</strong> quella italiana. Anche il Regno Unito accetta la doppia cittadinanza senza limiti.",

    { ul: [

      { it: "Continuerai a votare per le elezioni politiche italiane per corrispondenza e a rinnovare passaporto e carta d'identità italiani al consolato.", en: "You keep voting by post in Italian national elections and keep renewing your Italian passport and ID card at the consulate." },
      { it: "Per entrare in Italia usa il documento italiano, per rientrare nel Regno Unito quello britannico: è la regola pratica più semplice.", en: "Use your Italian document to enter Italy and your British one to re-enter the UK: that is the simplest practical rule." },
      { it: "I figli nati nel Regno Unito da genitore italiano sono italiani <em>iure sanguinis</em>: vanno trascritti al consolato.", en: "Children born in the UK to an Italian parent are Italian <em>iure sanguinis</em>: register their birth with the consulate." }

  links: [

    { u: "https://www.esteri.it/it/servizi-consolari-e-visti/italiani-all-estero/aire/", l: "Farnesina — AIRE" }
  ]
},
{
  id: "passaporto", p: "percorso", code: "1.9",
  t: { it: "Dopo la cittadinanza", en: "After citizenship" },
  lead: { it: "Passaporto britannico, diritto di voto, e cosa cambia davvero nella vita quotidiana.", en: "British passport, the right to vote, and what actually changes day to day." },
  body: [
    { ul: [
      { it: "<strong>Passaporto britannico</strong>: domanda online con il certificato di naturalizzazione, un garante e le foto.", en: "<strong>British passport</strong>: apply online with your naturalisation certificate, a countersignatory and photos." },
      { it: "<strong>Voto</strong>: puoi votare in tutte le elezioni, compresi i referendum, e candidarti.", en: "<strong>Voting</strong>: you can vote in every election, referendums included, and stand for office." },
      { it: "<strong>Nessun controllo sull'immigrazione</strong>: niente più scadenze del visto, niente più <em>Immigration Health Surcharge</em>.", en: "<strong>No immigration control</strong>: no visa expiry dates, no more Immigration Health Surcharge." },
      { it: "Puoi fare da garante per la cittadinanza di altri e chiedere il passaporto per i figli minorenni.", en: "You can act as a referee for others and apply for passports for your children." }

  links: [ { u: "https://www.gov.uk/apply-renew-passport", l: "GOV.UK — Apply for a British passport" } ]

/* ============ 2. IL TEST ============ */

  id: "test", p: "root", code: "2", tag: "exam",
  t: { it: "Life in the UK Test", en: "Life in the UK Test" },
  lead: { it: "L'esame vero e proprio: come funziona, come si prenota, come si passa.", en: "The exam itself: how it works, how to book it, how to pass it." },
  body: [ { p: {
    it: "Un test a scelta multipla al computer, in un centro autorizzato, in inglese (in Galles e Scozia si può richiedere in gallese o gaelico scozzese). Tutte le domande vengono <strong>esclusivamente</strong> dal manuale ufficiale: nulla di ciò che sai dai giornali o dalla vita quotidiana conta, se non è nel libro.",
    en: "A computer-based multiple-choice test taken at an approved centre, in English (Welsh or Scottish Gaelic can be requested in Wales and Scotland). Every question comes <strong>only</strong> from the official handbook: nothing you know from the news or daily life counts unless it is in the book."
  } } ],
  links: [ { u: "https://www.gov.uk/life-in-the-uk-test", l: "GOV.UK — Life in the UK Test" } ]
},
{
  id: "formato", p: "test", code: "2.1",
  t: { it: "Formato dell'esame", en: "Exam format" },
  lead: { it: "24 domande, 45 minuti, 18 risposte esatte per passare (75%).", en: "24 questions, 45 minutes, 18 correct answers to pass (75%)." },
  body: [
    { kv: [
      { k: { it: "Domande", en: "Questions" }, v: { it: "24, a scelta multipla, estratte da una banca dati riservata", en: "24, multiple choice, drawn from a confidential question bank" } },
      { k: { it: "Tempo", en: "Time" }, v: { it: "45 minuti (in media meno di 2 minuti a domanda: abbondante)", en: "45 minutes (under 2 minutes per question on average: plenty)" } },
      { k: { it: "Soglia", en: "Pass mark" }, v: { it: "<strong>18 su 24</strong> = 75%. Puoi sbagliarne 6", en: "<strong>18 out of 24</strong> = 75%. You can get 6 wrong" } },
      { k: { it: "Esito", en: "Result" }, v: { it: "Immediato, comunicato in centro; ricevi una lettera di conferma", en: "Immediate, given at the centre; you receive a confirmation letter" } },
      { k: { it: "Validità", en: "Validity" }, v: { it: "Il certificato <strong>non scade</strong>: vale per ILR e per la cittadinanza", en: "The certificate <strong>never expires</strong>: it counts for both ILR and citizenship" } }

    { ul: [
      { it: "Quattro tipi di domanda: scelta singola fra 4 opzioni; <em>vero o falso</em>; “quali <strong>due</strong> affermazioni sono corrette”; “scegli l'affermazione corretta fra due”.", en: "Four question types: one of four options; <em>true or false</em>; “which <strong>two</strong> statements are correct”; “choose the correct statement out of two”." },

  links: [ { u: "https://www.gov.uk/life-in-the-uk-test", l: "GOV.UK — Test format" } ]
},
{
  id: "prenotazione", p: "test", code: "2.2",
  t: { it: "Prenotare il test", en: "Booking the test" },
  lead: { it: "£50 online, almeno 3 giorni lavorativi prima, con l'indirizzo esatto del tuo documento.", en: "£50 online, at least 3 working days ahead, using the exact address on your ID." },
  body: [
    { ul: [
      { it: "Si prenota solo sul sito ufficiale GOV.UK: <strong>£50</strong>, carta di credito o debito.", en: "Book only on the official GOV.UK site: <strong>£50</strong>, credit or debit card." },
      { it: "Almeno <strong>3 giorni lavorativi</strong> di anticipo; oltre 30 centri autorizzati nel Regno Unito, scegli il più vicino.", en: "At least <strong>3 working days</strong> in advance; over 30 approved centres in the UK — pick the nearest." },
      { it: "L'<strong>indirizzo</strong> che inserisci deve coincidere <em>esattamente</em> con quello del documento che porterai. È il motivo numero uno per cui la gente viene respinta all'ingresso.", en: "The <strong>address</strong> you enter must match <em>exactly</em> the one on the ID you bring. This is the number-one reason people are turned away at the door." },
      { it: "Cancellazione o spostamento gratuiti solo con almeno 3 giorni lavorativi di preavviso; altrimenti perdi i £50.", en: "Free cancellation or rescheduling only with at least 3 working days' notice; otherwise you lose the £50." },
      { it: "Se hai bisogno di supporto (disabilità, dislessia, ipovisione) segnalalo <strong>in fase di prenotazione</strong>: dopo non si può.", en: "If you need support (disability, dyslexia, low vision) request it <strong>when booking</strong>: it cannot be added later." }
    ] }
  ],
  links: [ { u: "https://www.gov.uk/life-in-the-uk-test/book-your-test", l: "GOV.UK — Book your test" } ]
},
{
  id: "giorno", p: "test", code: "2.3",
  t: { it: "Il giorno dell'esame", en: "On the day" },
  lead: { it: "Documento valido, indirizzo corrispondente, niente telefono. Arrivare presto.", en: "Valid ID, matching address, no phone. Arrive early." },
  body: [
    { ul: [
      { it: "Porta un <strong>documento d'identità accettato</strong>: passaporto (anche italiano), BRP, patente di guida britannica con foto, oppure documento di viaggio riconosciuto.", en: "Bring <strong>accepted photo ID</strong>: a passport (an Italian one is fine), BRP, UK photocard driving licence, or a recognised travel document." },
      { it: "Arriva almeno <strong>15 minuti prima</strong>: in ritardo non ti fanno entrare e perdi la tassa.", en: "Arrive at least <strong>15 minutes early</strong>: latecomers are refused entry and lose the fee." },
      { it: "Telefoni, borse, orologi e appunti vanno negli armadietti. Niente si porta alla postazione.", en: "Phones, bags, watches and notes go in a locker. Nothing goes to the desk." },
      { it: "Prima delle 24 domande reali fai alcune <strong>domande di prova</strong> non valutate, per prendere confidenza con lo schermo.", en: "Before the 24 real questions you get some unscored <strong>practice questions</strong> to get used to the screen." },
      { it: "Il risultato arriva subito; se passi, conserva la lettera: ti servirà sia per l'ILR sia per la cittadinanza.", en: "You get the result immediately; if you pass, keep the letter — you need it for both ILR and citizenship." }
    ] }
  ],
  links: [ { u: "https://www.gov.uk/life-in-the-uk-test/what-to-take-to-your-test", l: "GOV.UK — What to take to your test" } ]
},
{
  id: "bocciato", p: "test", code: "2.4",
  t: { it: "Se non passi", en: "If you fail" },
  lead: { it: "Nessun limite di tentativi, ma 7 giorni di attesa e altri £50 ogni volta.", en: "No limit on attempts, but a 7-day wait and another £50 each time." },
  body: [
    { ul: [
      { it: "Puoi ripetere il test <strong>quante volte vuoi</strong>: non c'è un tetto di tentativi.", en: "You can retake the test <strong>as many times as you like</strong>: there is no cap." },

      { it: "Non ti dicono quali domande hai sbagliato. Torna sui capitoli più densi di numeri: storia e istituzioni.", en: "You are not told which questions you got wrong. Go back to the chapters densest in numbers: history and institutions." }

  ],
  links: [ { u: "https://www.gov.uk/life-in-the-uk-test", l: "GOV.UK — Retaking the test" } ]
},
{
  id: "esenzioni", p: "test", code: "2.5",
  t: { it: "Chi è esente", en: "Who is exempt" },

  body: [
    { ul: [
      { it: "Hai <strong>meno di 18</strong> anni o <strong>65 o più</strong> al momento della domanda.", en: "You are <strong>under 18</strong> or <strong>65 or over</strong> at the date of application." },
      { it: "Hai una <strong>condizione fisica o mentale</strong> di lungo periodo che ti impedisce di sostenere il test: serve una certificazione medica su modulo ufficiale.", en: "You have a long-term <strong>physical or mental condition</strong> that prevents you sitting it: a doctor's certificate on the official form is required." },
      { it: "Hai già superato il test in passato per l'ILR: <strong>non lo ripeti</strong>, il certificato resta valido.", en: "You already passed the test for ILR: <strong>you do not retake it</strong>, the certificate stays valid." }

{
  id: "materiale", p: "test", code: "2.6",
  t: { it: "Materiale ufficiale", en: "Official material" },
  lead: { it: "Un solo libro conta: <em>Life in the United Kingdom: A Guide for New Residents</em>, 3ª edizione.", en: "Only one book counts: <em>Life in the United Kingdom: A Guide for New Residents</em>, 3rd edition." },
  body: [
    { p: {
      it: "Il manuale è del <strong>2013</strong> ed è ancora l'unica fonte autorizzata nel 2026. È organizzato in <strong>cinque capitoli</strong>: sono le cinque aree centrali di questa mappa. Le domande escono solo da lì.",
      en: "The handbook dates from <strong>2013</strong> and is still the only authorised source in 2026. It is organised into <strong>five chapters</strong>: the five central areas of this map. Questions come from there and nowhere else."

    { ul: [

      { it: "Esistono anche l'<em>Official Study Guide</em> e l'<em>Official Practice Questions and Answers</em>, utili ma non obbligatori.", en: "There are also the <em>Official Study Guide</em> and <em>Official Practice Questions and Answers</em> — useful but not compulsory." },

  links: [

    { u: "https://www.gov.uk/life-in-the-uk-test/prepare-for-your-test", l: "GOV.UK — Prepare for your test" }
  ]

{
  id: "strategia", p: "test", code: "2.7",
  t: { it: "Strategia di studio", en: "Study strategy" },
  lead: { it: "Il test si vince sui numeri e sui nomi propri, non sulla comprensione generale.", en: "The test is won on numbers and proper names, not on general understanding." },
  body: [
    { ul: [
      { it: "<strong>Date e cifre</strong> sono il cuore del test: 1066, 1215, 1801, 1928, 650 MP, 129 MSP. Fai flashcard solo di quelle.", en: "<strong>Dates and figures</strong> are the core: 1066, 1215, 1801, 1928, 650 MPs, 129 MSPs. Make flashcards of those alone." },
      { it: "<strong>Nomi propri</strong>: chi ha inventato cosa, chi ha scritto cosa, chi ha vinto cosa. Il capitolo 4 è quasi solo elenchi di nomi.", en: "<strong>Proper names</strong>: who invented what, who wrote what, who won what. Chapter 4 is almost entirely name lists." },
      { it: "Fai <strong>mock test</strong> finché non stai stabilmente sopra il 90%: la soglia reale è 75%, ma l'ansia costa qualche punto.", en: "Do <strong>mock tests</strong> until you are consistently above 90%: the real bar is 75%, but nerves cost a few points." },

      { it: "Studia il capitolo 3 (storia) per <em>secoli</em>, non per fatti sparsi: la cronologia rende le date molto più facili da ricordare.", en: "Study chapter 3 (history) by <em>century</em>, not as scattered facts: the timeline makes dates far easier to hold." },

  links: [

  ]

  lead: { it: "B1 speaking &amp; listening: un requisito separato dal test, con esenzioni e regole proprie.", en: "B1 speaking &amp; listening: a separate requirement from the test, with its own exemptions and rules." },
  body: [ { p: {

  links: [ { u: "https://www.gov.uk/english-language", l: "GOV.UK — Prove your English" } ]

{

  t: { it: "Livello B1", en: "Level B1" },
  lead: { it: "Solo <em>speaking</em> e <em>listening</em>, al livello intermedio del quadro europeo CEFR.", en: "<em>Speaking</em> and <em>listening</em> only, at intermediate level on the CEFR scale." },
  body: [
    { p: {
      it: "Per cittadinanza e ILR serve il <strong>B1 del CEFR</strong>, limitatamente a <em>parlato</em> e <em>ascolto</em>. Non ti viene chiesto né lettura né scrittura: è una differenza importante rispetto ai test accademici.",
      en: "For citizenship and ILR you need <strong>CEFR B1</strong>, in <em>speaking</em> and <em>listening</em> only. Reading and writing are not tested: an important difference from academic exams."
    } },
    { ul: [
      { it: "In pratica: capire una conversazione normale su lavoro, scuola, tempo libero; raccontare esperienze e opinioni con frasi semplici ma corrette.", en: "In practice: understanding everyday conversation about work, school and leisure; describing experiences and opinions in simple but correct sentences." },
      { it: "Il certificato dev'essere di un <strong>SELT</strong> (Secure English Language Test) approvato dall'Home Office, sostenuto in un centro autorizzato.", en: "The certificate must be a Home Office–approved <strong>SELT</strong> (Secure English Language Test) taken at an approved centre." },
      { it: "Il certificato SELT ha una validità di <strong>2 anni</strong> per molti percorsi di visto, ma una volta usato per l'ILR di norma non va rifatto per la cittadinanza.", en: "SELT certificates are valid for <strong>2 years</strong> on many visa routes, but once used for ILR you normally do not retake it for citizenship." }

  links: [ { u: "https://www.gov.uk/english-language/approved-english-language-qualifications", l: "GOV.UK — Approved qualifications" } ]
},
{

  lead: { it: "Cinque fornitori autorizzati. Attenzione: la versione “UKVI” è l'unica valida.", en: "Five approved providers. Careful: only the “UKVI” version counts." },
  body: [

      { it: "<strong>LanguageCert</strong> SELT (International ESOL B1 Speaking &amp; Listening)", en: "<strong>LanguageCert</strong> SELT (International ESOL B1 Speaking &amp; Listening)" },
      { it: "<strong>Trinity College London</strong> — Integrated Skills in English / GESE grado 5", en: "<strong>Trinity College London</strong> — Integrated Skills in English / GESE grade 5" },
      { it: "<strong>Pearson</strong> PTE Academic UKVI / PTE Home", en: "<strong>Pearson</strong> PTE Academic UKVI / PTE Home" },

    { warn: {

  links: [ { u: "https://www.gov.uk/english-language/approved-english-language-qualifications", l: "GOV.UK — Elenco fornitori SELT" } ]

  body: [
    { ul: [
      { it: "Sei cittadino di un <strong>paese di lingua inglese riconosciuto</strong> (USA, Canada, Australia, Nuova Zelanda, Irlanda, molti Caraibi…). <strong>L'Italia non è nell'elenco.</strong>", en: "You are a national of a <strong>recognised majority English-speaking country</strong> (USA, Canada, Australia, New Zealand, Ireland, much of the Caribbean…). <strong>Italy is not on the list.</strong>" },
      { it: "Hai una <strong>laurea insegnata o ricercata in inglese</strong>: se conseguita all'estero serve la conferma <em>Ecctis</em> del livello e della lingua di insegnamento.", en: "You hold a <strong>degree taught or researched in English</strong>: if awarded abroad you need <em>Ecctis</em> confirmation of the level and the language of instruction." },

      { it: "Hai una <strong>condizione medica</strong> di lungo periodo documentata dal medico.", en: "You have a long-term <strong>medical condition</strong> documented by a doctor." },

    { p: {

{

      { k: { it: "TV e radio", en: "TV and radio" }, v: { it: "La <strong>BBC</strong>, finanziata dalla <em>TV licence</em>: è obbligatoria per guardare o registrare programmi in diretta e per usare iPlayer", en: "The <strong>BBC</strong>, funded by the <em>TV licence</em>: it is required to watch or record live broadcasts and to use iPlayer" } }
    ] }
  ],
  links: [ { u: "https://www.bbc.co.uk/proms", l: "BBC Proms" } ]
},

{
  id: "tempolibero", p: "ch4", code: "7.7",
  t: { it: "Tempo libero e luoghi", en: "Leisure and places" },
  lead: { it: "Pub, giardinaggio, National Trust e i siti UNESCO da conoscere.", en: "Pubs, gardening, the National Trust and the UNESCO sites to know." },
  body: [
    { ul: [
      { it: "<strong>Pub</strong>: al centro della vita sociale. Età minima per comprare alcolici: <strong>18</strong>; a 16 si può bere birra o vino con un pasto se accompagnati da un adulto (regole locali variabili).", en: "<strong>Pubs</strong>: central to social life. Minimum age to buy alcohol: <strong>18</strong>; at 16 you may drink beer or wine with a meal if accompanied by an adult (local rules vary)." },
      { it: "<strong>Giardinaggio</strong>: passione nazionale; il <strong>Chelsea Flower Show</strong> è l'evento simbolo.", en: "<strong>Gardening</strong>: a national passion; the <strong>Chelsea Flower Show</strong> is its landmark event." },
      { it: "<strong>National Trust</strong> (1895) e <strong>English Heritage</strong>: tutelano case storiche, coste e paesaggi, aperti al pubblico.", en: "The <strong>National Trust</strong> (1895) and <strong>English Heritage</strong>: they protect historic houses, coastline and landscape, open to the public." },
      { it: "Siti <strong>UNESCO</strong> citati: Stonehenge, Vallo di Adriano, la Giant's Causeway (Irlanda del Nord), le isole Orcadi, Blenheim Palace, la Jurassic Coast del Dorset e del Devon.", en: "<strong>UNESCO</strong> sites named: Stonehenge, Hadrian's Wall, the Giant's Causeway (Northern Ireland), Orkney, Blenheim Palace, the Dorset and East Devon Jurassic Coast." },
      { it: "Luoghi da ricordare: <strong>Big Ben</strong> (il campanone dell'Elizabeth Tower), <strong>Edinburgh Castle</strong>, <strong>Snowdonia</strong>, il <strong>Lake District</strong>, <strong>Loch Lomond</strong>, la <strong>London Eye</strong>.", en: "Places to remember: <strong>Big Ben</strong> (the great bell in the Elizabeth Tower), <strong>Edinburgh Castle</strong>, <strong>Snowdonia</strong>, the <strong>Lake District</strong>, <strong>Loch Lomond</strong>, the <strong>London Eye</strong>." }
    ] }
  ],
  links: [ { u: "https://www.nationaltrust.org.uk/", l: "National Trust" } ]
},

/* ============ 8. CAPITOLO 5 — GOVERNO E LEGGE ============ */
{
  id: "ch5", p: "root", code: "8", tag: "book",
  t: { it: "Cap. 5 — Governo e legge", en: "Ch. 5 — Government and the law" },
  lead: { it: "Monarchia, Parlamento, elezioni, devolution, giustizia e il tuo ruolo di cittadino.", en: "Monarchy, Parliament, elections, devolution, justice and your role as a citizen." },
  body: [ { p: {
    it: "Il secondo capitolo per peso d'esame. Denso di numeri (650 MP, 129 MSP, 90 MLA) e di distinzioni sottili: chi è eletto e chi è nominato, chi fa la legge e chi la applica.",
    en: "The second heaviest chapter in the exam. Dense with numbers (650 MPs, 129 MSPs, 90 MLAs) and fine distinctions: who is elected and who is appointed, who makes law and who applies it."

  links: [ { u: "https://www.parliament.uk/about/how/", l: "UK Parliament — How Parliament works" } ]
},
{
  id: "monarchia", p: "ch5", code: "8.1",
  t: { it: "La monarchia", en: "The monarchy" },
  lead: { it: "Il Re regna ma non governa: capo dello Stato, politicamente neutrale.", en: "The King reigns but does not rule: head of state, politically neutral." },
  body: [
    { ul: [
      { it: "Il Regno Unito è una <strong>monarchia costituzionale</strong>: il sovrano è capo dello Stato, il potere di governo sta al Parlamento e al Governo.", en: "The UK is a <strong>constitutional monarchy</strong>: the monarch is head of state, while governing power lies with Parliament and the Government." },
      { it: "Il monarca <strong>non è politicamente schierato</strong> e non esprime opinioni di parte.", en: "The monarch is <strong>politically neutral</strong> and expresses no party views." },
      { it: "Funzioni: apre il Parlamento ogni anno (<strong>State Opening</strong>, con il <em>King's Speech</em> scritto dal Governo), riceve settimanalmente il Primo Ministro, dà il <strong>Royal Assent</strong> alle leggi, nomina il Primo Ministro.", en: "Duties: opens Parliament each year (the <strong>State Opening</strong>, with the King's Speech written by the Government), meets the Prime Minister weekly, gives <strong>Royal Assent</strong> to laws, appoints the Prime Minister." },
      { it: "Il sovrano è <strong>Supreme Governor della Church of England</strong> e <strong>capo del Commonwealth</strong>.", en: "The monarch is <strong>Supreme Governor of the Church of England</strong> and <strong>Head of the Commonwealth</strong>." },
      { it: "<strong>Aggiornamento</strong>: il manuale descrive <strong>Elisabetta II</strong>, regina dal 1952. Dal settembre 2022 il sovrano è <strong>Carlo III</strong> e le domande d'esame sul “re attuale” sono state aggiornate di conseguenza; il <strong>Principe di Galles</strong> è oggi <strong>William</strong>.", en: "<strong>Update</strong>: the handbook describes <strong>Elizabeth II</strong>, queen from 1952. Since September 2022 the monarch is <strong>Charles III</strong>, and exam questions about “the current king” have been updated accordingly; the <strong>Prince of Wales</strong> is now <strong>William</strong>." }
    ] }
  ],
  links: [ { u: "https://www.royal.uk/", l: "The Royal Family — royal.uk" } ]
},
{
  id: "parlamento", p: "ch5", code: "8.2",
  t: { it: "Il Parlamento", en: "Parliament" },
  lead: { it: "Commons eletti, Lords nominati, Corona: le tre parti che fanno la legge.", en: "An elected Commons, an appointed Lords and the Crown: the three parts that make law." },
  body: [
    { kv: [
      { k: { it: "House of Commons", en: "House of Commons" }, v: { it: "<strong>650 MP</strong> eletti, uno per <em>constituency</em>; è la camera che conta di più perché è eletta e controlla il bilancio", en: "<strong>650 MPs</strong> elected, one per constituency; the more powerful chamber because it is elected and controls money" } },
      { k: { it: "House of Lords", en: "House of Lords" }, v: { it: "Non eletta: <strong>life peers</strong> nominati, alcuni <strong>hereditary peers</strong>, vescovi anglicani. Rivede e può ritardare le leggi, ma i Commons possono avere l'ultima parola", en: "Unelected: appointed <strong>life peers</strong>, some <strong>hereditary peers</strong>, and Church of England bishops. It revises and can delay legislation, but the Commons can have the final say" } },
      { k: { it: "Speaker", en: "The Speaker" }, v: { it: "Presiede i Commons, è <strong>politicamente neutrale</strong> pur essendo un MP eletto dai colleghi", en: "Chairs the Commons and is <strong>politically neutral</strong>, though an MP chosen by fellow MPs" } },
      { k: { it: "Corona", en: "The Crown" }, v: { it: "Il <strong>Royal Assent</strong> completa il percorso di una legge", en: "<strong>Royal Assent</strong> completes a law's passage" } },
      { k: { it: "Opposizione", en: "The Opposition" }, v: { it: "Il secondo partito forma lo <strong>shadow cabinet</strong>; il suo leader guida l'opposizione ufficiale", en: "The second-largest party forms the <strong>shadow cabinet</strong>; its leader heads the official Opposition" } },
      { k: { it: "Whips", en: "Whips" }, v: { it: "Assicurano la disciplina di voto dei parlamentari del partito", en: "Ensure party MPs vote with the line" } },
      { k: { it: "Sede", en: "Where" }, v: { it: "<strong>Palace of Westminster</strong>, Londra", en: "The <strong>Palace of Westminster</strong>, London" } }
    ] }
  ],
  links: [ { u: "https://www.parliament.uk/about/how/", l: "UK Parliament — How it works" } ]
},
{
  id: "governo", p: "ch5", code: "8.3",
  t: { it: "Governo e Primo Ministro", en: "Government and Prime Minister" },
  lead: { it: "Il PM guida il Cabinet; i civil servants restano al loro posto quando cambia il governo.", en: "The PM leads the Cabinet; civil servants stay put when the government changes." },
  body: [
    { ul: [
      { it: "Il <strong>Primo Ministro</strong> è il leader del partito che riesce a formare una maggioranza nei Commons; risiede al <strong>10 Downing Street</strong> e ha una residenza di campagna a <strong>Chequers</strong>.", en: "The <strong>Prime Minister</strong> is the leader of the party able to command a majority in the Commons; lives at <strong>10 Downing Street</strong> with a country house at <strong>Chequers</strong>." },
      { it: "Nomina il <strong>Cabinet</strong>, una ventina di ministri di primo piano: <em>Chancellor of the Exchequer</em> (economia), <em>Home Secretary</em> (interni e immigrazione), <em>Foreign Secretary</em> (esteri), <em>Lord Chancellor</em> (giustizia).", en: "They appoint the <strong>Cabinet</strong>, around twenty senior ministers: the <em>Chancellor of the Exchequer</em> (economy), <em>Home Secretary</em> (interior and immigration), <em>Foreign Secretary</em>, <em>Lord Chancellor</em> (justice)." },
      { it: "I <strong>civil servants</strong> sono funzionari professionali, <strong>politicamente neutrali</strong> e scelti per merito: restano in carica quando cambia il governo.", en: "<strong>Civil servants</strong> are professional officials, <strong>politically neutral</strong> and appointed on merit: they stay when the government changes." },
      { it: "Il governo locale (<em>councils</em>) gestisce scuole, rifiuti, strade e servizi sociali, finanziato dalla <strong>council tax</strong> e da trasferimenti centrali.", en: "Local government (<em>councils</em>) runs schools, waste, roads and social services, funded by <strong>council tax</strong> and central grants." },
      { it: "La stampa è libera e non censurata: il manuale sottolinea che i giornali possono criticare apertamente il governo.", en: "The press is free and uncensored: the handbook stresses that newspapers may openly criticise the government." }
    ] }
  ],
  links: [ { u: "https://www.gov.uk/government/how-government-works", l: "GOV.UK — How government works" } ]
},
{
  id: "elezioni", p: "ch5", code: "8.4",
  t: { it: "Elezioni e voto", en: "Elections and voting" },
  lead: { it: "First past the post, almeno ogni 5 anni, voto a 18 anni, registro elettorale obbligatorio.", en: "First past the post, at least every 5 years, voting at 18, compulsory electoral registration." },
  body: [
    { ul: [
      { it: "<strong>General election</strong> almeno ogni <strong>5 anni</strong>; il sistema è il <strong>first past the post</strong>: in ogni collegio vince chi prende più voti.", en: "A <strong>general election</strong> at least every <strong>5 years</strong>; the system is <strong>first past the post</strong>: whoever gets most votes in a constituency wins it." },
      { it: "Una <strong>by-election</strong> si tiene quando un seggio resta vacante fra un'elezione generale e l'altra.", en: "A <strong>by-election</strong> is held when a seat falls vacant between general elections." },
      { it: "Si vota a <strong>18 anni</strong>; in Scozia e Galles si vota a <strong>16</strong> per le elezioni devolute e locali.", en: "You vote at <strong>18</strong>; in Scotland and Wales at <strong>16</strong> for devolved and local elections." },
      { it: "Bisogna essere iscritti all'<strong>electoral register</strong>: l'iscrizione è un obbligo di legge per il capofamiglia contattato.", en: "You must be on the <strong>electoral register</strong>: registering is a legal duty when your household is asked." },
      { it: "I seggi (<em>polling stations</em>) aprono dalle <strong>7:00 alle 22:00</strong>; il voto è <strong>segreto</strong>. Si può votare per posta o per delega (<em>proxy</em>).", en: "Polling stations open <strong>7am to 10pm</strong>; the ballot is <strong>secret</strong>. You can vote by post or by proxy." },
      { it: "<strong>Aggiornamento post-manuale</strong>: dal maggio 2023 in Gran Bretagna serve un <strong>documento con foto</strong> per votare di persona.", en: "<strong>Update since the handbook</strong>: since May 2023, <strong>photo ID</strong> is required to vote in person in Great Britain." },
      { it: "Chiunque può assistere ai dibattiti dei Commons e dei Lords dalle gallerie pubbliche, o contattare il proprio MP.", en: "Anyone can watch Commons and Lords debates from the public galleries, or contact their own MP." }
    ] }
  ],
  links: [
    { u: "https://www.gov.uk/register-to-vote", l: "GOV.UK — Register to vote" },
    { u: "https://www.electoralcommission.org.uk/", l: "Electoral Commission" }
  ]
},
{
  id: "devolution", p: "ch5", code: "8.5",
  t: { it: "Devolution", en: "Devolution" },
  lead: { it: "Poteri trasferiti a Edimburgo, Cardiff e Belfast dal 1998-99.", en: "Powers transferred to Edinburgh, Cardiff and Belfast since 1998–99." },
  body: [
    { kv: [
      { k: { it: "Scozia", en: "Scotland" }, v: { it: "<strong>Scottish Parliament</strong> a <strong>Holyrood</strong>, Edimburgo: <strong>129 MSP</strong>. Poteri su sanità, istruzione, giustizia e alcune imposte", en: "The <strong>Scottish Parliament</strong> at <strong>Holyrood</strong>, Edinburgh: <strong>129 MSPs</strong>. Powers over health, education, justice and some taxes" } },
      { k: { it: "Galles", en: "Wales" }, v: { it: "<strong>Senedd Cymru / Welsh Parliament</strong> a Cardiff: <strong>60 membri</strong>. Nel manuale del 2013 è ancora la <em>National Assembly for Wales</em>, rinominata nel 2020", en: "The <strong>Senedd Cymru / Welsh Parliament</strong> in Cardiff: <strong>60 members</strong>. In the 2013 handbook it is still the <em>National Assembly for Wales</em>, renamed in 2020" } },
      { k: { it: "Irlanda del Nord", en: "Northern Ireland" }, v: { it: "<strong>Northern Ireland Assembly</strong> a <strong>Stormont</strong>, Belfast: <strong>90 MLA</strong>, con governo di condivisione del potere nato dal Good Friday Agreement", en: "The <strong>Northern Ireland Assembly</strong> at <strong>Stormont</strong>, Belfast: <strong>90 MLAs</strong>, with power-sharing government from the Good Friday Agreement" } },
      { k: { it: "Non devoluto", en: "Reserved" }, v: { it: "Restano a Westminster: difesa, politica estera, immigrazione, politica monetaria", en: "Kept at Westminster: defence, foreign policy, immigration, monetary policy" } }
    ] },
    { p: {
      it: "I sistemi elettorali devoluti usano forme di rappresentanza proporzionale, non il <em>first past the post</em>.",
      en: "The devolved bodies use forms of proportional representation, not first past the post."
    } }
  ],
  links: [ { u: "https://www.parliament.scot/", l: "Scottish Parliament" } ]
},
{
  id: "giustizia", p: "ch5", code: "8.6",
  t: { it: "Il sistema giudiziario", en: "The justice system" },
  lead: { it: "Penale e civile, magistrati volontari, giurie da 12 (15 in Scozia), giudici indipendenti.", en: "Criminal and civil, volunteer magistrates, juries of 12 (15 in Scotland), independent judges." },
  body: [
    { kv: [
      { k: { it: "Principio", en: "Principle" }, v: { it: "I <strong>giudici sono indipendenti</strong> dal governo e interpretano la legge; la presunzione di innocenza è la regola", en: "<strong>Judges are independent</strong> of government and interpret the law; the presumption of innocence is the rule" } },
      { k: { it: "Reati minori", en: "Minor crimes" }, v: { it: "<strong>Magistrates' Court</strong> in Inghilterra, Galles e Irlanda del Nord: giudici volontari non retribuiti (<em>Justices of the Peace</em>), di norma senza formazione legale. In Scozia: <strong>Justice of the Peace Court</strong>", en: "The <strong>Magistrates' Court</strong> in England, Wales and Northern Ireland: unpaid volunteer <em>Justices of the Peace</em>, usually without legal training. In Scotland: the <strong>Justice of the Peace Court</strong>" } },
      { k: { it: "Reati gravi", en: "Serious crimes" }, v: { it: "<strong>Crown Court</strong> con giuria di <strong>12</strong> persone (Inghilterra, Galles, Irlanda del Nord); in Scozia lo <strong>Sheriff Court</strong> o l'High Court con giuria di <strong>15</strong>", en: "The <strong>Crown Court</strong> with a jury of <strong>12</strong> (England, Wales, Northern Ireland); in Scotland the <strong>Sheriff Court</strong> or High Court with a jury of <strong>15</strong>" } },
      { k: { it: "Cause civili", en: "Civil cases" }, v: { it: "<strong>County Court</strong> per debiti, contratti, divorzi; il <strong>small claims</strong> per cause di modesto valore, senza avvocato", en: "The <strong>County Court</strong> for debt, contracts and divorce; the <strong>small claims</strong> procedure for low-value cases, without a lawyer" } },
      { k: { it: "Vertice", en: "Top" }, v: { it: "La <strong>Supreme Court</strong>, dal 2009, è l'ultimo grado di appello", en: "The <strong>Supreme Court</strong>, since 2009, is the final court of appeal" } },
      { k: { it: "Assistenza", en: "Help" }, v: { it: "<strong>Solicitor</strong> per consulenza e pratiche; il <strong>legal aid</strong> può coprire le spese di chi non può permettersele", en: "A <strong>solicitor</strong> for advice and paperwork; <strong>legal aid</strong> can cover costs for those who cannot pay" } }
    ] }
  ],
  links: [ { u: "https://www.judiciary.uk/", l: "Courts and Tribunals Judiciary" } ]
},
{
  id: "polizia-diritti", p: "ch5", code: "8.7",
  t: { it: "Polizia e diritti", en: "Police and rights" },
  lead: { it: "Doveri della polizia, i tuoi diritti e le leggi contro la discriminazione.", en: "Police duties, your rights and the laws against discrimination." },
  body: [
    { ul: [
      { it: "La polizia deve <strong>proteggere il pubblico, prevenire e indagare i reati</strong> e agire con equità e onestà; risponde a un <strong>Police and Crime Commissioner</strong> eletto, e i reclami vanno all'organo indipendente di vigilanza.", en: "The police must <strong>protect the public, prevent and investigate crime</strong> and act fairly and honestly; they answer to an elected <strong>Police and Crime Commissioner</strong>, and complaints go to the independent watchdog." },
      { it: "L'<strong>Equality Act 2010</strong> vieta la discriminazione per età, disabilità, sesso, gravidanza, razza, religione o credo, orientamento sessuale, identità di genere, stato civile.", en: "The <strong>Equality Act 2010</strong> prohibits discrimination on grounds of age, disability, sex, pregnancy, race, religion or belief, sexual orientation, gender reassignment and marriage." },
      { it: "Sono reati gravi la <strong>violenza domestica</strong>, le <strong>mutilazioni genitali femminili</strong>, il <strong>matrimonio forzato</strong> e i cosiddetti “delitti d'onore”: nessuna tradizione li giustifica.", en: "<strong>Domestic violence</strong>, <strong>female genital mutilation</strong>, <strong>forced marriage</strong> and so-called “honour” crimes are serious offences: no tradition excuses them." },
      { it: "Sono reati anche il possesso di droghe, la guida in stato di ebbrezza, il possesso di coltelli o armi, e il reato d'odio (<em>hate crime</em>).", en: "Drug possession, drink-driving, carrying knives or weapons and hate crime are all criminal offences." },
      { it: "Chi ha bisogno di aiuto può rivolgersi a <strong>Citizens Advice</strong>, gratuito e indipendente.", en: "Anyone needing help can turn to <strong>Citizens Advice</strong>, free and independent." }
    ] }
  ],
  links: [
    { u: "https://www.citizensadvice.org.uk/", l: "Citizens Advice" },
    { u: "https://www.equalityhumanrights.com/", l: "Equality and Human Rights Commission" }
  ]
},
{
  id: "doveri-civici", p: "ch5", code: "8.8",
  t: { it: "Tasse e doveri civici", en: "Tax and civic duties" },
  lead: { it: "National Insurance, income tax, self assessment, giuria, patente.", en: "National Insurance, income tax, self assessment, jury service, driving." },
  body: [

<script>
/* ============================================================

(function () {
  "use strict";

  var LS = "mappa-cittadinanza-uk";
  var N = MAPPA.nodes;
  var byId = {};
  N.forEach(function (n) { byId[n.id] = n; });

  var childrenOf = {};

  /* ------------------------------ stato ------------------------------ */

  var state = {
    lang: "it",
    view: window.matchMedia("(min-width: 900px)").matches ? "map" : "outline",
    theme: null,

  try {
    var saved = JSON.parse(localStorage.getItem(LS) || "{}");
    if (saved.lang) state.lang = saved.lang;
    if (saved.view) state.view = saved.view;
    if (saved.theme) state.theme = saved.theme;
    if (saved.done) state.done = saved.done;
  } catch (e) { /* storage non disponibile: si prosegue con i valori di default */ }

  function save() {
    try {
      localStorage.setItem(LS, JSON.stringify({
        lang: state.lang, view: state.view, theme: state.theme, done: state.done
      }));
    } catch (e) { /* ignora */ }
  }

  /* --------------------------- utilità testo --------------------------- */

  function L(o) { return o ? (o[state.lang] || o.it || o.en || "") : ""; }
  function other() { return state.lang === "it" ? "en" : "it"; }
  function strip(s) { return String(s).replace(/<[^>]*>/g, ""); }

  function branchOf(n) {
    while (n && n.p && n.p !== "root") n = byId[n.p];
    return n && n.p === "root" ? n : null;
  }
  function hueOf(n) {
    if (!n || n.id === "root") return "var(--ink)";
    var b = n.p === "root" ? n : branchOf(n);
    return b ? "var(--c-" + b.id + ")" : "var(--ink-3)";

  var T = {

      map: "Mappa", outline: "Indice", search: "Cerca…",

      colophon: "Materiale di studio in italiano e inglese, aggiornato ad agosto 2026. Non è consulenza legale: prima di prenotare, pagare o presentare domanda verifica sempre le pagine ufficiali GOV.UK linkate in ogni scheda."
    },

      colophon: "Study material in Italian and English, current to August 2026. Not legal advice: before booking, paying or applying, always check the official GOV.UK pages linked in each card."

  /* ------------------------------ icone ------------------------------ */

  var ICON = {
    search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    map: '<svg viewBox="0 0 24 24"><path d="m9 4-6 3v13l6-3 6 3 6-3V4l-6 3z"/><path d="M9 4v13M15 7v13"/></svg>',
    list: '<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>',
    plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
    minus: '<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
    fit: '<svg viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg>',
    close: '<svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>',
    check: '<svg viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></svg>',
    left: '<svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg>',
    right: '<svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg>',
    ext: '<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',

  };

  /* =========================== INTELAIATURA =========================== */

  var app = document.getElementById("app");
  app.innerHTML =
    '<header class="bar">' +

          '<div class="results" id="results" role="listbox"></div></div>' +
        '<div class="lang" role="group" aria-label="Lingua / Language">' +
          '<button id="lang-it" aria-pressed="true">IT</button>' +

        '</div>' +
        '<button class="btn" id="view-toggle" aria-pressed="false"></button>' +

    '<div class="stage">' +
      '<div class="viewport" id="viewport">' +
        '<div class="world" id="world">' +
          '<svg class="links" id="links" viewBox="0 0 2800 2800" preserveAspectRatio="none" aria-hidden="true"></svg>' +
        '</div>' +

          '<button id="zin" aria-label="Zoom +">' + ICON.plus + '</button>' +

        '</div>' +

    '</div>';

  var viewport = document.getElementById("viewport");
  var hintSeen = false;
  function dismissHint() {
    if (hintSeen) return;
    hintSeen = true;

    if (h) { h.style.opacity = "0"; setTimeout(function () { h.style.display = "none"; }, 400); }
  }
  var world = document.getElementById("world");
  var svg = document.getElementById("links");
  var panel = document.getElementById("panel");
  var outline = document.getElementById("outline");
  var results = document.getElementById("results");
  var qInput = document.getElementById("q");

  var W = 2800, C = 1400;

  /* ============================= LAYOUT ============================= */

  var geom = {};    // id -> {x, y, ang}

  function compact() { return window.innerWidth < 760; }

  function layout() {
    geom = {};
    var rHub = compact() ? 300 : 360;
    var rLeaf = compact() ? 545 : 640;
    var rStagger = compact() ? 105 : 122;

    geom.root = { x: C, y: C, ang: -90 };

    branches.forEach(function (b, i) {
      var a = -90 + i * (360 / branches.length);
      var rad = a * Math.PI / 180;
      geom[b.id] = { x: C + Math.cos(rad) * rHub, y: C + Math.sin(rad) * rHub, ang: a };

      if (state.open !== b.id) return;
      var kids = childrenOf[b.id] || [];
      var n = kids.length;
      var spread = Math.min(92, Math.max(0, (n - 1) * 11.5));
      var step = n > 1 ? spread / (n - 1) : 0;
      kids.forEach(function (k, j) {
        var ka = a - spread / 2 + j * step;
        var kr = rLeaf + (j % 2) * rStagger;
        var krad = ka * Math.PI / 180;
        geom[k.id] = { x: C + Math.cos(krad) * kr, y: C + Math.sin(krad) * kr, ang: ka };
      });
    });
  }

  function visibleNodes() {
    return N.filter(function (n) { return !!geom[n.id]; });
  }

  /* ============================ DISEGNO ============================ */

  var nodeEls = {};

  function drawNodes(animateIds) {
    var wanted = {};
    visibleNodes().forEach(function (n) { wanted[n.id] = true; });

    // rimuove i nodi non più visibili
    Object.keys(nodeEls).forEach(function (id) {
      if (!wanted[id]) { nodeEls[id].remove(); delete nodeEls[id]; }
    });

    visibleNodes().forEach(function (n) {
      var el = nodeEls[n.id];
      if (!el) {
        el = document.createElement("button");
        el.type = "button";
        el.className = "node " + (n.id === "root" ? "root" : n.p === "root" ? "hub" : "leaf");
        el.dataset.id = n.id;
        el.addEventListener("click", function () { activate(n.id, true); });
        world.appendChild(el);
        nodeEls[n.id] = el;
        if (animateIds && animateIds[n.id]) {
          el.classList.add("appear");
          el.style.animationDelay = (animateIds[n.id] * 22) + "ms";
        }
