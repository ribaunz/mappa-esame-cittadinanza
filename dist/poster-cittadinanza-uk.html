<style>
/* ============================================================
   Bussola della Cittadinanza — poster stampabile
   Il foglio è sempre carta bianca (è una stampa, non un'interfaccia);
   solo la scrivania intorno segue il tema del lettore.
   ============================================================ */

:root {
  --desk: #DDE2DC;
  --desk-ink: #14202E;
  --desk-mute: #5B6A7C;
  --desk-line: #C4CCC4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0C1219;
    --desk-ink: #E5EDF4;
    --desk-mute: #92A3B4;
    --desk-line: #26323F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0C1219;
  --desk-ink: #E5EDF4;
  --desk-mute: #92A3B4;
  --desk-line: #26323F;
  color-scheme: dark;
}

/* --- tavolozza del foglio: fissa, calibrata per l'inchiostro --- */
.poster {
  --ink:    #14202E;
  --ink-2:  #4A5A6E;
  --ink-3:  #7C8B9B;
  --rule:   #C3CCC4;
  --rule-2: #DFE4DD;
  --wash:   #F2F5F0;
  --accent: #A81D26;

  --c1: #1F3E6E; --c2: #A81D26; --c3: #1B6B63;
  --c4: #6B3A6E; --c5: #3D6B2E; --c6: #8A5A17;
  --c7: #A03A5C; --c8: #2A5680; --c9: #7A6410;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--desk);
  color: var(--desk-ink);
  font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ============================ COMANDI ============================ */

.controls {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: color-mix(in srgb, var(--desk) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--desk-line);
  flex-wrap: wrap;
}
.controls .title {
  font-family: "Newsreader", Georgia, serif;
  font-size: 17px;
  font-weight: 600;
  margin-right: auto;
}
.controls .title small {
  font-family: "IBM Plex Mono", monospace;
  font-size: 10px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--desk-mute);
  margin-left: 8px;
}
.ctl {
  height: 32px;
  padding: 0 11px;
  font: inherit;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--desk-ink);
  background: color-mix(in srgb, var(--desk) 60%, #fff 40%);
  border: 1px solid var(--desk-line);
  border-radius: 7px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.ctl:hover { border-color: var(--desk-mute); }
.ctl[aria-pressed="true"] { background: var(--desk-ink); color: var(--desk); border-color: var(--desk-ink); }
.ctl.primary { background: #A81D26; border-color: #A81D26; color: #fff; }
.ctl.primary:hover { background: #8E141C; }
.seg { display: inline-flex; border: 1px solid var(--desk-line); border-radius: 7px; overflow: hidden; }
.seg .ctl { border: 0; border-radius: 0; }
.seg .ctl + .ctl { border-left: 1px solid var(--desk-line); }
:focus-visible { outline: 2px solid #A81D26; outline-offset: 2px; }

/* ============================= IL FOGLIO ============================= */

.desk { padding: 22px 14px 60px; display: flex; justify-content: center; }
.scaler { transform-origin: top center; }

.poster {
  width: var(--pw);
  height: var(--ph);
  padding: var(--pad);
  background: #fff;
  color: var(--ink);
  box-shadow: 0 2px 8px rgba(0,0,0,.14), 0 18px 50px rgba(0,0,0,.18);
  font-size: var(--fs);
  line-height: 1.3;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* A3 orizzontale — il formato da parete */
.poster[data-size="a3"] { --pw: 420mm; --ph: 297mm; --pad: 9mm; --fs: 2.95mm; }
/* A4 orizzontale — la stessa mappa, da scrivania */
.poster[data-size="a4"] { --pw: 297mm; --ph: 210mm; --pad: 6.4mm; --fs: 2.086mm; }

/* ============================== TESTATA ============================== */

.phead {
  display: flex;
  align-items: flex-end;
  gap: 2em;
  padding-bottom: 1.1em;
  border-bottom: 0.55mm solid var(--ink);
  flex: none;
}

.phead .root { flex: none; max-width: 62em; }
.phead .kicker {
  font-family: "IBM Plex Mono", monospace;
  font-size: .78em;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--accent);
  display: block;
  margin-bottom: .5em;
}
.phead h1 {
  font-family: "Newsreader", Georgia, serif;
  font-size: 4.1em;
  font-weight: 600;
  line-height: .96;
  letter-spacing: -0.02em;
  margin: 0;
}
.phead h1 span {
  display: block;
  font-size: .46em;
  font-style: italic;
  font-weight: 400;
  color: var(--ink-3);
  letter-spacing: 0;
  margin-top: .35em;
}
.phead .blurb {
  font-size: 1.05em;
  color: var(--ink-2);
  max-width: 44em;
  margin: 0 0 .2em;
}
.phead .blurb b { color: var(--ink); font-weight: 600; }

.statstrip {
  margin-left: auto;
  display: flex;
  gap: 1.4em;
  flex: none;
  padding-bottom: .2em;
}
.statstrip div { text-align: right; }
.statstrip .n {
  font-family: "Newsreader", Georgia, serif;
  font-size: 2.5em;
  font-weight: 600;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  display: block;
}
.statstrip .l {
  font-family: "IBM Plex Mono", monospace;
  font-size: .72em;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-3);
  display: block;
  margin-top: .45em;
}

/* ============================== LA MAPPA ============================== */

.map { flex: 1; display: flex; flex-direction: column; min-height: 0; padding-top: 1.6em; }

/* il tronco: una linea orizzontale da cui scendono i nove rami */
.trunk {
  height: 0.45mm;
  background: var(--ink);
  position: relative;
  flex: none;
  margin: 0 0 0 0;
}
.trunk::before {
  content: "";
  position: absolute;
  left: 0; top: -1.1mm;
  width: 2.2mm; height: 2.2mm;
  border-radius: 50%;
  background: var(--ink);
}

.cols {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  gap: 0 1.1em;
  flex: 1;
  min-height: 0;
  align-items: start;
}

.col { display: flex; flex-direction: column; min-width: 0; }

/* il gambo che collega il tronco al riquadro dell'area */
.col .stem { height: 2.6em; width: 0.4mm; background: var(--hue); margin-left: 1.1em; flex: none; }

.hub {
  border: 0.4mm solid var(--hue);
  border-left-width: 1.1mm;
  border-radius: 1mm;
  padding: .6em .7em .65em;
  flex: none;
}
.hub .code {
  font-family: "IBM Plex Mono", monospace;
  font-size: .74em;
  letter-spacing: .1em;
  color: var(--hue);
  font-weight: 500;
}
.hub h2 {
  font-family: "Newsreader", Georgia, serif;
  font-size: 1.32em;
  font-weight: 600;
  line-height: 1.08;
  margin: .15em 0 .12em;
  text-wrap: balance;
}
.hub .en {
  font-family: "Newsreader", Georgia, serif;
  font-style: italic;
  font-size: .92em;
  color: var(--ink-3);
  line-height: 1.15;
  display: block;
}
.hub .lead {
  font-size: .84em;
  line-height: 1.24;
  color: var(--ink-2);
  margin: .5em 0 0;
  padding-top: .45em;
  border-top: 0.2mm solid var(--rule-2);
}

/* la colonna di voci, appesa a una guida verticale */
.leaves {
  list-style: none;
  margin: 0;
  padding: 0 0 0 1.5em;
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: .62em;
  padding-top: .75em;
}
.leaves::before {
  content: "";
  position: absolute;
  left: 1.1em; top: 0; bottom: .9em;
  width: 0.28mm;
  background: color-mix(in srgb, var(--hue) 55%, #fff);
}
.leaves li { position: relative; padding-left: .1em; }
.leaves li::before {
  content: "";
  position: absolute;
  left: -.4em; top: .62em;
  width: .35em; height: 0.28mm;
  background: color-mix(in srgb, var(--hue) 55%, #fff);
}
.leaves .code {
  font-family: "IBM Plex Mono", monospace;
  font-size: .7em;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.leaves .it { font-size: .98em; font-weight: 600; line-height: 1.16; display: block; }
.leaves .en {
  font-size: .86em;
  font-style: italic;
  color: var(--ink-3);
  line-height: 1.14;
  display: block;
  font-family: "Newsreader", Georgia, serif;
}

/* =========================== FASCIA IN BASSO =========================== */

.facts {
  flex: none;
  margin-top: 1.4em;
  padding-top: 1em;
  border-top: 0.55mm solid var(--ink);
  display: grid;
  grid-template-columns: 1.35fr 1fr 1fr 1fr;
  gap: 0 1.6em;
}
.facts section { min-width: 0; }
.facts h3 {
  font-family: "IBM Plex Mono", monospace;
  font-size: .74em;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 .7em;
  font-weight: 500;
}
.facts dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: .34em .8em; }
.facts dt {
  font-family: "IBM Plex Mono", monospace;
  font-size: .82em;
  font-weight: 500;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.facts dd { margin: 0; font-size: .88em; color: var(--ink-2); line-height: 1.25; }
.facts dd b { color: var(--ink); font-weight: 600; }

.timeline { grid-column: 1 / -1; margin-bottom: 1.1em; }
.tlrow { display: flex; align-items: stretch; border-top: 0.28mm solid var(--rule); padding-top: .5em; gap: 0; }
.tlrow div {
  flex: 1;
  min-width: 0;
  padding-right: .7em;
  border-left: 0.28mm solid var(--rule);
  padding-left: .5em;
  position: relative;
}
.tlrow div:first-child { border-left: 0; padding-left: 0; }
.tlrow .y {
  font-family: "IBM Plex Mono", monospace;
  font-size: .88em;
  font-weight: 500;
  display: block;
  font-variant-numeric: tabular-nums;
}
.tlrow .e { font-size: .82em; color: var(--ink-2); line-height: 1.16; display: block; margin-top: .15em; }

.colophon {
  grid-column: 1 / -1;
  margin-top: 1em;
  padding-top: .7em;
  border-top: 0.28mm solid var(--rule-2);
  display: flex;
  gap: 1.5em;
  align-items: baseline;
  font-size: .8em;
  color: var(--ink-3);
}
.colophon .warn { color: var(--ink-2); }
.colophon .warn b { color: var(--accent); font-weight: 600; }
.colophon .src { margin-left: auto; font-family: "IBM Plex Mono", monospace; letter-spacing: .04em; white-space: nowrap; }

/* =============================== STAMPA =============================== */

@page { margin: 0; }
.poster[data-size="a3"] { page-break-after: avoid; }

@media print {
  body { background: #fff; }
  .controls, .deskhint { display: none !important; }
  .desk { padding: 0; display: block; }
  .scaler { transform: none !important; }
  .poster { box-shadow: none; }
}

.deskhint {
  text-align: center;
  color: var(--desk-mute);
  font-size: 12px;
  padding: 18px 14px 0;
}

      { k: { it: "Ultimi 12 mesi", en: "Final 12 months" }, v: { it: "Max <strong>90 giorni</strong>, in entrambi i percorsi", en: "No more than <strong>90 days</strong>, on either route" } },
      { k: { it: "Primo giorno", en: "Day one" }, v: { it: "Devi essere fisicamente nel Regno Unito esattamente 5 (o 3) anni prima della domanda", en: "You must have been physically in the UK exactly 5 (or 3) years before the application" } }
    ] },
    { p: {
      it: "L'Home Office ha un margine di discrezionalità per superamenti contenuti, ma non contarci: è discrezionale, non un diritto. Tieni un registro dei viaggi con date di partenza e rientro fin dal primo giorno.",
      en: "The Home Office has discretion over modest excesses, but do not rely on it: it is discretionary, not a right. Keep a travel log with departure and return dates from day one."

  links: [ { u: "https://www.gov.uk/apply-citizenship-indefinite-leave-to-remain", l: "GOV.UK — Residence requirements" } ]

  id: "carattere", p: "percorso", code: "1.4",
  t: { it: "Good character", en: "Good character" },
  lead: { it: "Fedina penale, tasse, debiti, precedenti violazioni delle norme sull'immigrazione.", en: "Criminal record, tax, debts and any past immigration breaches." },
  body: [
    { p: {
      it: "Concetto ampio e valutato caso per caso. L'Home Office guarda indietro nel tempo su condanne, multe non pagate, insolvenze, evasione fiscale, inganno nelle domande precedenti e ingressi irregolari.",
      en: "A broad test, assessed case by case. The Home Office looks back over convictions, unpaid fines, insolvency, tax evasion, deception in earlier applications and irregular entry."

    { ul: [
      { it: "Le condanne penali comportano periodi di preclusione che dipendono dalla pena (le sentenze più gravi possono precludere in modo permanente).", en: "Criminal convictions trigger exclusion periods that depend on the sentence (the most serious sentences can bar you permanently)." },
      { it: "Anche le sanzioni non penali contano: multe stradali non pagate, NHS debts sopra soglia, evasione contributiva.", en: "Non-criminal penalties count too: unpaid traffic fines, NHS debts above the threshold, unpaid tax or National Insurance." },
      { it: "Dichiarare tutto è sempre meglio che omettere: la reticenza scoperta è “deception” e pesa più dell'episodio nascosto.", en: "Always declare: concealment discovered later counts as deception and weighs more heavily than the thing concealed." }
    ] }
  ],
  links: [ { u: "https://www.gov.uk/government/publications/good-character-nationality-policy-guidance", l: "GOV.UK — Good character guidance" } ]
},
{
  id: "domanda", p: "percorso", code: "1.5",
  t: { it: "La domanda", en: "The application" },
  lead: { it: "Modulo AN online, biometria, due garanti (referees), documenti e tempi di attesa.", en: "Form AN online, biometrics, two referees, documents and processing times." },
  body: [
    { kv: [
      { k: { it: "Modulo", en: "Form" }, v: { it: "<strong>Form AN</strong>, online su GOV.UK", en: "<strong>Form AN</strong>, online on GOV.UK" } },
      { k: { it: "Biometria", en: "Biometrics" }, v: { it: "Appuntamento UKVCAS: foto e impronte", en: "UKVCAS appointment: photo and fingerprints" } },

      { k: { it: "Documenti", en: "Documents" }, v: { it: "Passaporto, BRP/eVisa, certificato Life in the UK, certificato inglese, prova di residenza", en: "Passport, BRP/eVisa, Life in the UK certificate, English certificate, proof of residence" } },

    ] },
    { p: {

      en: "You keep your passport: since 2019 you upload scans rather than posting originals. The UK has moved to the digital <strong>eVisa</strong> in place of the physical BRP: check you have a working UKVI account before you apply."

  ],
  links: [
    { u: "https://www.gov.uk/apply-citizenship-indefinite-leave-to-remain/how-to-apply", l: "GOV.UK — How to apply" },
    { u: "https://www.gov.uk/get-access-evisa", l: "GOV.UK — eVisa" }
  ]
},
{
  id: "costi", p: "percorso", code: "1.6",
  t: { it: "Costi e tempi", en: "Costs and timing" },
  lead: { it: "Quanto costa davvero: tassa di naturalizzazione, cerimonia, test, inglese, passaporto.", en: "What it really costs: naturalisation fee, ceremony, test, English exam, passport." },
  body: [
    { kv: [
      { k: { it: "Naturalizzazione (adulto)", en: "Naturalisation (adult)" }, v: { it: "circa <strong>£1.839</strong>, di cui £130 di cerimonia, riscossi insieme", en: "about <strong>£1,839</strong>, including the £130 ceremony fee, charged upfront" } },
      { k: { it: "Life in the UK Test", en: "Life in the UK Test" }, v: { it: "£50 a tentativo, non rimborsabile", en: "£50 per attempt, non-refundable" } },
      { k: { it: "Test di inglese SELT", en: "SELT English test" }, v: { it: "circa £150 (se non sei esente)", en: "around £150 (if you are not exempt)" } },
      { k: { it: "Manuale ufficiale", en: "Official handbook" }, v: { it: "circa £13 cartaceo, meno in digitale", en: "about £13 in print, less as an ebook" } },
      { k: { it: "Passaporto britannico", en: "British passport" }, v: { it: "tassa a parte, dopo la cerimonia", en: "a separate fee, after the ceremony" } }
    ] },
    { warn: {
      it: "Le tariffe dell'Home Office cambiano quasi ogni anno, di solito in primavera. Il totale qui è indicativo per il 2026: <strong>verifica sempre la tabella tariffe ufficiale</strong> prima di pagare. La tassa non viene rimborsata se la domanda è respinta (torna solo la quota cerimonia).",

{
  id: "cerimonia", p: "percorso", code: "1.7",
  t: { it: "Cerimonia e giuramento", en: "Ceremony and oath" },
  lead: { it: "Entro 3 mesi dall'invito: giuramento di fedeltà, promessa e certificato di naturalizzazione.", en: "Within 3 months of the invitation: oath of allegiance, pledge and naturalisation certificate." },
  body: [
    { p: {
      it: "Approvata la domanda ricevi un invito e devi presentarti alla cerimonia <strong>entro 3 mesi</strong>. Si tiene di solito presso il consiglio comunale (<em>local council</em>), con il ritratto del Re e la bandiera.",
      en: "Once approved you receive an invitation and must attend a ceremony <strong>within 3 months</strong>. It is usually held at your local council, with a portrait of the King and the flag."
    } },
    { ul: [
      { it: "<strong>Oath of allegiance</strong> (giuramento religioso) oppure <strong>affirmation</strong> (dichiarazione laica): fedeltà al Re e ai suoi eredi.", en: "<strong>Oath of allegiance</strong> (religious) or <strong>affirmation</strong> (secular): loyalty to the King and his heirs." },
      { it: "<strong>Pledge</strong>: promessa di lealtà al Regno Unito, di rispettarne diritti, libertà e leggi.", en: "<strong>Pledge</strong>: loyalty to the UK, respecting its rights, freedoms and laws." },
      { it: "Si canta o si ascolta l'inno nazionale, <em>God Save the King</em>.", en: "The national anthem, <em>God Save the King</em>, is sung or played." },
      { it: "Ricevi il <strong>certificato di naturalizzazione</strong>: da quel momento sei cittadino britannico e puoi chiedere il passaporto.", en: "You receive your <strong>naturalisation certificate</strong>: from that moment you are a British citizen and can apply for a passport." }
    ] }
  ],
  links: [ { u: "https://www.gov.uk/citizenship-ceremony", l: "GOV.UK — Citizenship ceremonies" } ]
},
{
  id: "doppia", p: "percorso", code: "1.8", tag: "italy",
  t: { it: "Doppia cittadinanza IT/UK", en: "Dual Italian/British citizenship" },
  lead: { it: "L'Italia non ti fa perdere la cittadinanza: diventi britannico e resti italiano. Ma l'AIRE va aggiornata.", en: "Italy does not take your citizenship away: you become British and stay Italian. But your AIRE registration must be updated." },
  body: [
    { p: {
      it: "La <strong>legge 91/1992</strong> ammette la doppia cittadinanza: acquisire volontariamente quella britannica <strong>non fa perdere</strong> quella italiana. Anche il Regno Unito accetta la doppia cittadinanza senza limiti.",
      en: "Italian <strong>Law 91/1992</strong> allows dual nationality: voluntarily acquiring British citizenship <strong>does not cost you</strong> your Italian one. The UK likewise accepts dual citizenship without restriction."
    } },
    { ul: [
      { it: "Resta iscritto all'<strong>AIRE</strong> presso il Consolato Generale d'Italia a Londra (o quello competente per la tua contea) e comunica ogni cambio di indirizzo.", en: "Stay registered with <strong>AIRE</strong> at the Italian Consulate General in London (or the one covering your county) and report every change of address." },
      { it: "Continuerai a votare per le elezioni politiche italiane per corrispondenza e a rinnovare passaporto e carta d'identità italiani al consolato.", en: "You keep voting by post in Italian national elections and keep renewing your Italian passport and ID card at the consulate." },
      { it: "Per entrare in Italia usa il documento italiano, per rientrare nel Regno Unito quello britannico: è la regola pratica più semplice.", en: "Use your Italian document to enter Italy and your British one to re-enter the UK: that is the simplest practical rule." },
      { it: "I figli nati nel Regno Unito da genitore italiano sono italiani <em>iure sanguinis</em>: vanno trascritti al consolato.", en: "Children born in the UK to an Italian parent are Italian <em>iure sanguinis</em>: register their birth with the consulate." }
    ] }
  ],
  links: [
    { u: "https://conslondra.esteri.it/", l: "Consolato Generale d'Italia a Londra" },
    { u: "https://www.esteri.it/it/servizi-consolari-e-visti/italiani-all-estero/aire/", l: "Farnesina — AIRE" }
  ]
},
{
  id: "passaporto", p: "percorso", code: "1.9",
  t: { it: "Dopo la cittadinanza", en: "After citizenship" },
  lead: { it: "Passaporto britannico, diritto di voto, e cosa cambia davvero nella vita quotidiana.", en: "British passport, the right to vote, and what actually changes day to day." },
  body: [
    { ul: [
      { it: "<strong>Passaporto britannico</strong>: domanda online con il certificato di naturalizzazione, un garante e le foto.", en: "<strong>British passport</strong>: apply online with your naturalisation certificate, a countersignatory and photos." },
      { it: "<strong>Voto</strong>: puoi votare in tutte le elezioni, compresi i referendum, e candidarti.", en: "<strong>Voting</strong>: you can vote in every election, referendums included, and stand for office." },
      { it: "<strong>Nessun controllo sull'immigrazione</strong>: niente più scadenze del visto, niente più <em>Immigration Health Surcharge</em>.", en: "<strong>No immigration control</strong>: no visa expiry dates, no more Immigration Health Surcharge." },
      { it: "Puoi fare da garante per la cittadinanza di altri e chiedere il passaporto per i figli minorenni.", en: "You can act as a referee for others and apply for passports for your children." }
    ] }
  ],
  links: [ { u: "https://www.gov.uk/apply-renew-passport", l: "GOV.UK — Apply for a British passport" } ]
}

/* ============ 2. IL TEST ============ */
{
  id: "test", p: "root", code: "2", tag: "exam",
  t: { it: "Life in the UK Test", en: "Life in the UK Test" },
  lead: { it: "L'esame vero e proprio: come funziona, come si prenota, come si passa.", en: "The exam itself: how it works, how to book it, how to pass it." },
  body: [ { p: {
    it: "Un test a scelta multipla al computer, in un centro autorizzato, in inglese (in Galles e Scozia si può richiedere in gallese o gaelico scozzese). Tutte le domande vengono <strong>esclusivamente</strong> dal manuale ufficiale: nulla di ciò che sai dai giornali o dalla vita quotidiana conta, se non è nel libro.",
    en: "A computer-based multiple-choice test taken at an approved centre, in English (Welsh or Scottish Gaelic can be requested in Wales and Scotland). Every question comes <strong>only</strong> from the official handbook: nothing you know from the news or daily life counts unless it is in the book."
  } } ],
  links: [ { u: "https://www.gov.uk/life-in-the-uk-test", l: "GOV.UK — Life in the UK Test" } ]
},
{
  id: "formato", p: "test", code: "2.1",
  t: { it: "Formato dell'esame", en: "Exam format" },
  lead: { it: "24 domande, 45 minuti, 18 risposte esatte per passare (75%).", en: "24 questions, 45 minutes, 18 correct answers to pass (75%)." },
  body: [
    { kv: [
      { k: { it: "Domande", en: "Questions" }, v: { it: "24, a scelta multipla, estratte da una banca dati riservata", en: "24, multiple choice, drawn from a confidential question bank" } },
      { k: { it: "Tempo", en: "Time" }, v: { it: "45 minuti (in media meno di 2 minuti a domanda: abbondante)", en: "45 minutes (under 2 minutes per question on average: plenty)" } },
      { k: { it: "Soglia", en: "Pass mark" }, v: { it: "<strong>18 su 24</strong> = 75%. Puoi sbagliarne 6", en: "<strong>18 out of 24</strong> = 75%. You can get 6 wrong" } },
      { k: { it: "Esito", en: "Result" }, v: { it: "Immediato, comunicato in centro; ricevi una lettera di conferma", en: "Immediate, given at the centre; you receive a confirmation letter" } },
      { k: { it: "Validità", en: "Validity" }, v: { it: "Il certificato <strong>non scade</strong>: vale per ILR e per la cittadinanza", en: "The certificate <strong>never expires</strong>: it counts for both ILR and citizenship" } }
    ] },
    { ul: [
      { it: "Quattro tipi di domanda: scelta singola fra 4 opzioni; <em>vero o falso</em>; “quali <strong>due</strong> affermazioni sono corrette”; “scegli l'affermazione corretta fra due”.", en: "Four question types: one of four options; <em>true or false</em>; “which <strong>two</strong> statements are correct”; “choose the correct statement out of two”." },
      { it: "Puoi contrassegnare le domande e tornarci prima di consegnare.", en: "You can flag questions and return to them before submitting." },
      { it: "Nessuna penalità per la risposta sbagliata: non lasciare mai una domanda in bianco.", en: "No penalty for a wrong answer: never leave a question blank." }

  links: [ { u: "https://www.gov.uk/life-in-the-uk-test", l: "GOV.UK — Test format" } ]
},
{
  id: "prenotazione", p: "test", code: "2.2",
  t: { it: "Prenotare il test", en: "Booking the test" },
  lead: { it: "£50 online, almeno 3 giorni lavorativi prima, con l'indirizzo esatto del tuo documento.", en: "£50 online, at least 3 working days ahead, using the exact address on your ID." },
  body: [
    { ul: [
      { it: "Si prenota solo sul sito ufficiale GOV.UK: <strong>£50</strong>, carta di credito o debito.", en: "Book only on the official GOV.UK site: <strong>£50</strong>, credit or debit card." },
      { it: "Almeno <strong>3 giorni lavorativi</strong> di anticipo; oltre 30 centri autorizzati nel Regno Unito, scegli il più vicino.", en: "At least <strong>3 working days</strong> in advance; over 30 approved centres in the UK — pick the nearest." },
      { it: "L'<strong>indirizzo</strong> che inserisci deve coincidere <em>esattamente</em> con quello del documento che porterai. È il motivo numero uno per cui la gente viene respinta all'ingresso.", en: "The <strong>address</strong> you enter must match <em>exactly</em> the one on the ID you bring. This is the number-one reason people are turned away at the door." },
      { it: "Cancellazione o spostamento gratuiti solo con almeno 3 giorni lavorativi di preavviso; altrimenti perdi i £50.", en: "Free cancellation or rescheduling only with at least 3 working days' notice; otherwise you lose the £50." },
      { it: "Se hai bisogno di supporto (disabilità, dislessia, ipovisione) segnalalo <strong>in fase di prenotazione</strong>: dopo non si può.", en: "If you need support (disability, dyslexia, low vision) request it <strong>when booking</strong>: it cannot be added later." }
    ] }
  ],
  links: [ { u: "https://www.gov.uk/life-in-the-uk-test/book-your-test", l: "GOV.UK — Book your test" } ]
},
{

  t: { it: "Il giorno dell'esame", en: "On the day" },
  lead: { it: "Documento valido, indirizzo corrispondente, niente telefono. Arrivare presto.", en: "Valid ID, matching address, no phone. Arrive early." },
  body: [
    { ul: [
      { it: "Porta un <strong>documento d'identità accettato</strong>: passaporto (anche italiano), BRP, patente di guida britannica con foto, oppure documento di viaggio riconosciuto.", en: "Bring <strong>accepted photo ID</strong>: a passport (an Italian one is fine), BRP, UK photocard driving licence, or a recognised travel document." },
      { it: "Arriva almeno <strong>15 minuti prima</strong>: in ritardo non ti fanno entrare e perdi la tassa.", en: "Arrive at least <strong>15 minutes early</strong>: latecomers are refused entry and lose the fee." },
      { it: "Telefoni, borse, orologi e appunti vanno negli armadietti. Niente si porta alla postazione.", en: "Phones, bags, watches and notes go in a locker. Nothing goes to the desk." },
      { it: "Prima delle 24 domande reali fai alcune <strong>domande di prova</strong> non valutate, per prendere confidenza con lo schermo.", en: "Before the 24 real questions you get some unscored <strong>practice questions</strong> to get used to the screen." },
      { it: "Il risultato arriva subito; se passi, conserva la lettera: ti servirà sia per l'ILR sia per la cittadinanza.", en: "You get the result immediately; if you pass, keep the letter — you need it for both ILR and citizenship." }
    ] }
  ],
  links: [ { u: "https://www.gov.uk/life-in-the-uk-test/what-to-take-to-your-test", l: "GOV.UK — What to take to your test" } ]

  id: "bocciato", p: "test", code: "2.4",
  t: { it: "Se non passi", en: "If you fail" },
  lead: { it: "Nessun limite di tentativi, ma 7 giorni di attesa e altri £50 ogni volta.", en: "No limit on attempts, but a 7-day wait and another £50 each time." },
  body: [
    { ul: [
      { it: "Puoi ripetere il test <strong>quante volte vuoi</strong>: non c'è un tetto di tentativi.", en: "You can retake the test <strong>as many times as you like</strong>: there is no cap." },
      { it: "Devi però aspettare almeno <strong>7 giorni</strong> tra un tentativo e l'altro.", en: "But you must wait at least <strong>7 days</strong> between attempts." },
      { it: "Ogni tentativo costa <strong>£50</strong> pieni: non ci sono sconti sulle ripetizioni.", en: "Each attempt costs the full <strong>£50</strong>: there is no repeat discount." },
      { it: "Non ti dicono quali domande hai sbagliato. Torna sui capitoli più densi di numeri: storia e istituzioni.", en: "You are not told which questions you got wrong. Go back to the chapters densest in numbers: history and institutions." }

  ],
  links: [ { u: "https://www.gov.uk/life-in-the-uk-test", l: "GOV.UK — Retaking the test" } ]

  id: "esenzioni", p: "test", code: "2.5",

  body: [
    { ul: [
      { it: "Hai <strong>meno di 18</strong> anni o <strong>65 o più</strong> al momento della domanda.", en: "You are <strong>under 18</strong> or <strong>65 or over</strong> at the date of application." },
      { it: "Hai una <strong>condizione fisica o mentale</strong> di lungo periodo che ti impedisce di sostenere il test: serve una certificazione medica su modulo ufficiale.", en: "You have a long-term <strong>physical or mental condition</strong> that prevents you sitting it: a doctor's certificate on the official form is required." },
      { it: "Hai già superato il test in passato per l'ILR: <strong>non lo ripeti</strong>, il certificato resta valido.", en: "You already passed the test for ILR: <strong>you do not retake it</strong>, the certificate stays valid." }

  links: [ { u: "https://www.gov.uk/life-in-the-uk-test/who-needs-to-take-the-test", l: "GOV.UK — Who needs to take the test" } ]

  body: [
    { p: {
      it: "Il manuale è del <strong>2013</strong> ed è ancora l'unica fonte autorizzata nel 2026. È organizzato in <strong>cinque capitoli</strong>: sono le cinque aree centrali di questa mappa. Le domande escono solo da lì.",

    { ul: [

      { it: "Esistono anche l'<em>Official Study Guide</em> e l'<em>Official Practice Questions and Answers</em>, utili ma non obbligatori.", en: "There are also the <em>Official Study Guide</em> and <em>Official Practice Questions and Answers</em> — useful but not compulsory." },

{

  t: { it: "Strategia di studio", en: "Study strategy" },

  body: [
    { ul: [
      { it: "<strong>Date e cifre</strong> sono il cuore del test: 1066, 1215, 1801, 1928, 650 MP, 129 MSP. Fai flashcard solo di quelle.", en: "<strong>Dates and figures</strong> are the core: 1066, 1215, 1801, 1928, 650 MPs, 129 MSPs. Make flashcards of those alone." },
      { it: "<strong>Nomi propri</strong>: chi ha inventato cosa, chi ha scritto cosa, chi ha vinto cosa. Il capitolo 4 è quasi solo elenchi di nomi.", en: "<strong>Proper names</strong>: who invented what, who wrote what, who won what. Chapter 4 is almost entirely name lists." },
      { it: "Fai <strong>mock test</strong> finché non stai stabilmente sopra il 90%: la soglia reale è 75%, ma l'ansia costa qualche punto.", en: "Do <strong>mock tests</strong> until you are consistently above 90%: the real bar is 75%, but nerves cost a few points." },

      { it: "Studia il capitolo 3 (storia) per <em>secoli</em>, non per fatti sparsi: la cronologia rende le date molto più facili da ricordare.", en: "Study chapter 3 (history) by <em>century</em>, not as scattered facts: the timeline makes dates far easier to hold." },

  ]

/* ============ 4. CAPITOLO 1 — VALORI ============ */

{
  id: "ch5", p: "root", code: "8", tag: "book",
  t: { it: "Cap. 5 — Governo e legge", en: "Ch. 5 — Government and the law" },
  lead: { it: "Monarchia, Parlamento, elezioni, devolution, giustizia e il tuo ruolo di cittadino.", en: "Monarchy, Parliament, elections, devolution, justice and your role as a citizen." },
  body: [ { p: {
    it: "Il secondo capitolo per peso d'esame. Denso di numeri (650 MP, 129 MSP, 90 MLA) e di distinzioni sottili: chi è eletto e chi è nominato, chi fa la legge e chi la applica.",
    en: "The second heaviest chapter in the exam. Dense with numbers (650 MPs, 129 MSPs, 90 MLAs) and fine distinctions: who is elected and who is appointed, who makes law and who applies it."
  } } ],
  links: [ { u: "https://www.parliament.uk/about/how/", l: "UK Parliament — How Parliament works" } ]
},
{
  id: "monarchia", p: "ch5", code: "8.1",
  t: { it: "La monarchia", en: "The monarchy" },
  lead: { it: "Il Re regna ma non governa: capo dello Stato, politicamente neutrale.", en: "The King reigns but does not rule: head of state, politically neutral." },
  body: [
    { ul: [
      { it: "Il Regno Unito è una <strong>monarchia costituzionale</strong>: il sovrano è capo dello Stato, il potere di governo sta al Parlamento e al Governo.", en: "The UK is a <strong>constitutional monarchy</strong>: the monarch is head of state, while governing power lies with Parliament and the Government." },
      { it: "Il monarca <strong>non è politicamente schierato</strong> e non esprime opinioni di parte.", en: "The monarch is <strong>politically neutral</strong> and expresses no party views." },
      { it: "Funzioni: apre il Parlamento ogni anno (<strong>State Opening</strong>, con il <em>King's Speech</em> scritto dal Governo), riceve settimanalmente il Primo Ministro, dà il <strong>Royal Assent</strong> alle leggi, nomina il Primo Ministro.", en: "Duties: opens Parliament each year (the <strong>State Opening</strong>, with the King's Speech written by the Government), meets the Prime Minister weekly, gives <strong>Royal Assent</strong> to laws, appoints the Prime Minister." },
      { it: "Il sovrano è <strong>Supreme Governor della Church of England</strong> e <strong>capo del Commonwealth</strong>.", en: "The monarch is <strong>Supreme Governor of the Church of England</strong> and <strong>Head of the Commonwealth</strong>." },
      { it: "<strong>Aggiornamento</strong>: il manuale descrive <strong>Elisabetta II</strong>, regina dal 1952. Dal settembre 2022 il sovrano è <strong>Carlo III</strong> e le domande d'esame sul “re attuale” sono state aggiornate di conseguenza; il <strong>Principe di Galles</strong> è oggi <strong>William</strong>.", en: "<strong>Update</strong>: the handbook describes <strong>Elizabeth II</strong>, queen from 1952. Since September 2022 the monarch is <strong>Charles III</strong>, and exam questions about “the current king” have been updated accordingly; the <strong>Prince of Wales</strong> is now <strong>William</strong>." }
    ] }
  ],
  links: [ { u: "https://www.royal.uk/", l: "The Royal Family — royal.uk" } ]
},
{
  id: "parlamento", p: "ch5", code: "8.2",
  t: { it: "Il Parlamento", en: "Parliament" },
  lead: { it: "Commons eletti, Lords nominati, Corona: le tre parti che fanno la legge.", en: "An elected Commons, an appointed Lords and the Crown: the three parts that make law." },
  body: [
    { kv: [
      { k: { it: "House of Commons", en: "House of Commons" }, v: { it: "<strong>650 MP</strong> eletti, uno per <em>constituency</em>; è la camera che conta di più perché è eletta e controlla il bilancio", en: "<strong>650 MPs</strong> elected, one per constituency; the more powerful chamber because it is elected and controls money" } },
      { k: { it: "House of Lords", en: "House of Lords" }, v: { it: "Non eletta: <strong>life peers</strong> nominati, alcuni <strong>hereditary peers</strong>, vescovi anglicani. Rivede e può ritardare le leggi, ma i Commons possono avere l'ultima parola", en: "Unelected: appointed <strong>life peers</strong>, some <strong>hereditary peers</strong>, and Church of England bishops. It revises and can delay legislation, but the Commons can have the final say" } },
      { k: { it: "Speaker", en: "The Speaker" }, v: { it: "Presiede i Commons, è <strong>politicamente neutrale</strong> pur essendo un MP eletto dai colleghi", en: "Chairs the Commons and is <strong>politically neutral</strong>, though an MP chosen by fellow MPs" } },
      { k: { it: "Corona", en: "The Crown" }, v: { it: "Il <strong>Royal Assent</strong> completa il percorso di una legge", en: "<strong>Royal Assent</strong> completes a law's passage" } },
      { k: { it: "Opposizione", en: "The Opposition" }, v: { it: "Il secondo partito forma lo <strong>shadow cabinet</strong>; il suo leader guida l'opposizione ufficiale", en: "The second-largest party forms the <strong>shadow cabinet</strong>; its leader heads the official Opposition" } },
      { k: { it: "Whips", en: "Whips" }, v: { it: "Assicurano la disciplina di voto dei parlamentari del partito", en: "Ensure party MPs vote with the line" } },
      { k: { it: "Sede", en: "Where" }, v: { it: "<strong>Palace of Westminster</strong>, Londra", en: "The <strong>Palace of Westminster</strong>, London" } }
    ] }
  ],
  links: [ { u: "https://www.parliament.uk/about/how/", l: "UK Parliament — How it works" } ]
},
{
  id: "governo", p: "ch5", code: "8.3",
  t: { it: "Governo e Primo Ministro", en: "Government and Prime Minister" },
  lead: { it: "Il PM guida il Cabinet; i civil servants restano al loro posto quando cambia il governo.", en: "The PM leads the Cabinet; civil servants stay put when the government changes." },
  body: [
    { ul: [
      { it: "Il <strong>Primo Ministro</strong> è il leader del partito che riesce a formare una maggioranza nei Commons; risiede al <strong>10 Downing Street</strong> e ha una residenza di campagna a <strong>Chequers</strong>.", en: "The <strong>Prime Minister</strong> is the leader of the party able to command a majority in the Commons; lives at <strong>10 Downing Street</strong> with a country house at <strong>Chequers</strong>." },
      { it: "Nomina il <strong>Cabinet</strong>, una ventina di ministri di primo piano: <em>Chancellor of the Exchequer</em> (economia), <em>Home Secretary</em> (interni e immigrazione), <em>Foreign Secretary</em> (esteri), <em>Lord Chancellor</em> (giustizia).", en: "They appoint the <strong>Cabinet</strong>, around twenty senior ministers: the <em>Chancellor of the Exchequer</em> (economy), <em>Home Secretary</em> (interior and immigration), <em>Foreign Secretary</em>, <em>Lord Chancellor</em> (justice)." },
      { it: "I <strong>civil servants</strong> sono funzionari professionali, <strong>politicamente neutrali</strong> e scelti per merito: restano in carica quando cambia il governo.", en: "<strong>Civil servants</strong> are professional officials, <strong>politically neutral</strong> and appointed on merit: they stay when the government changes." },
      { it: "Il governo locale (<em>councils</em>) gestisce scuole, rifiuti, strade e servizi sociali, finanziato dalla <strong>council tax</strong> e da trasferimenti centrali.", en: "Local government (<em>councils</em>) runs schools, waste, roads and social services, funded by <strong>council tax</strong> and central grants." },
      { it: "La stampa è libera e non censurata: il manuale sottolinea che i giornali possono criticare apertamente il governo.", en: "The press is free and uncensored: the handbook stresses that newspapers may openly criticise the government." }
    ] }
  ],
  links: [ { u: "https://www.gov.uk/government/how-government-works", l: "GOV.UK — How government works" } ]
},
{
  id: "elezioni", p: "ch5", code: "8.4",
  t: { it: "Elezioni e voto", en: "Elections and voting" },
  lead: { it: "First past the post, almeno ogni 5 anni, voto a 18 anni, registro elettorale obbligatorio.", en: "First past the post, at least every 5 years, voting at 18, compulsory electoral registration." },
  body: [
    { ul: [
      { it: "<strong>General election</strong> almeno ogni <strong>5 anni</strong>; il sistema è il <strong>first past the post</strong>: in ogni collegio vince chi prende più voti.", en: "A <strong>general election</strong> at least every <strong>5 years</strong>; the system is <strong>first past the post</strong>: whoever gets most votes in a constituency wins it." },
      { it: "Una <strong>by-election</strong> si tiene quando un seggio resta vacante fra un'elezione generale e l'altra.", en: "A <strong>by-election</strong> is held when a seat falls vacant between general elections." },

        ["2013", { it: "manuale di 3ª edizione: unica fonte", en: "3rd-edition handbook: the only source" }]
      ]
    },
    {
      h: { it: "La domanda in numeri", en: "The application in numbers" },
      rows: [
        ["5 anni", { it: "residenza · max <b>450 giorni</b> fuori", en: "residence · max <b>450 days</b> away" }],
        ["3 anni", { it: "se coniuge · max <b>270 giorni</b>", en: "if a spouse · max <b>270 days</b>" }],
        ["90 gg", { it: "massimo nell'ultimo anno", en: "maximum in the final year" }],
        ["12 mesi", { it: "di ILR prima di fare domanda", en: "holding ILR before applying" }],
        ["B1", { it: "inglese · <b>B2 dal 26.3.2027</b>", en: "English · <b>B2 from 26.3.2027</b>" }],
        ["~£1.839", { it: "tassa 2026, cerimonia inclusa", en: "2026 fee, ceremony included" }],
        ["3 mesi", { it: "per la cerimonia dopo l'invito", en: "to attend the ceremony after the invitation" }]
      ]
    },
    {
      h: { it: "Istituzioni in cifre", en: "Institutions in figures" },
      rows: [
        ["650", { it: "MP alla Camera dei Comuni", en: "MPs in the House of Commons" }],
        ["129", { it: "MSP al Parlamento scozzese", en: "MSPs in the Scottish Parliament" }],
        ["60", { it: "membri del Senedd gallese", en: "members of the Welsh Senedd" }],
        ["90", { it: "MLA all'Assemblea nordirlandese", en: "MLAs in the NI Assembly" }],
        ["12 · 15", { it: "giurati: Inghilterra · Scozia", en: "jurors: England · Scotland" }],
        ["18 · 16", { it: "voto: politiche · devolute SCO/WAL", en: "voting: general · devolved SCO/WAL" }],
        ["5 anni", { it: "intervallo massimo fra elezioni", en: "maximum gap between elections" }]
      ]
    },
    {
      h: { it: "Le quattro nazioni", en: "The four nations" },
      rows: [
        ["Inghilterra", { it: "Londra · <b>St George, 23 apr</b> · rosa", en: "London · <b>St George, 23 Apr</b> · rose" }],
        ["Scozia", { it: "Edimburgo · <b>St Andrew, 30 nov</b> · cardo", en: "Edinburgh · <b>St Andrew, 30 Nov</b> · thistle" }],
        ["Galles", { it: "Cardiff · <b>St David, 1 mar</b> · narciso", en: "Cardiff · <b>St David, 1 Mar</b> · daffodil" }],
        ["Irl. del Nord", { it: "Belfast · <b>St Patrick, 17 mar</b> · trifoglio", en: "Belfast · <b>St Patrick, 17 Mar</b> · shamrock" }],
        ["Union Flag", { it: "tre croci: Giorgio, Andrea, Patrizio — <b>il Galles non c'è</b>", en: "three crosses: George, Andrew, Patrick — <b>Wales is absent</b>" }],
        ["GB ≠ UK", { it: "Gran Bretagna = senza l'Irlanda del Nord", en: "Great Britain = without Northern Ireland" }]
      ]
    }
  ];

  var COPY = {
    it: {
      kicker: "Mappa concettuale · Life in the UK Test · aggiornata ad agosto 2026",
      blurb: "Nove aree, 63 voci. Le prime tre sono la <b>procedura</b>; le cinque centrali sono i capitoli del <b>manuale ufficiale</b> da cui escono tutte le domande; l'ultima raccoglie gli <b>aggiornamenti 2026</b>.",
      stats: [["24", "domande"], ["45'", "minuti"], ["18", "per passare"], ["£50", "a tentativo"]],
      tl: "Le date che tornano più spesso",
      warn: "<b>Materiale di studio, non consulenza legale.</b> Tariffe e requisiti dell'Home Office cambiano quasi ogni anno: verifica su GOV.UK prima di prenotare, pagare o presentare domanda.",
      src: "Fonte: Life in the United Kingdom — A Guide for New Residents, 3ª ed. · GOV.UK",
      print: "Stampa", fit: "Adatta", full: "100%", size: "Formato"
    },
    en: {
      kicker: "Concept map · Life in the UK Test · current to August 2026",
      blurb: "Nine areas, 63 entries. The first three are the <b>process</b>; the five in the middle are the chapters of the <b>official handbook</b> every question comes from; the last gathers the <b>2026 updates</b>.",
      stats: [["24", "questions"], ["45'", "minutes"], ["18", "to pass"], ["£50", "per attempt"]],
      tl: "The dates that come up most",
      warn: "<b>Study material, not legal advice.</b> Home Office fees and requirements change almost every year: check GOV.UK before booking, paying or applying.",
      src: "Source: Life in the United Kingdom — A Guide for New Residents, 3rd ed. · GOV.UK",
      print: "Print", fit: "Fit", full: "100%", size: "Size"
    }
  };

  /* ------------------------- stato ------------------------- */

  var state = { lang: "it", size: "a3", zoom: "fit" };
  try {
    var s = JSON.parse(localStorage.getItem("mappa-cittadinanza-uk") || "{}");
    if (s.lang) state.lang = s.lang;
  } catch (e) { /* nessuna preferenza salvata */ }

  function L(o) { return typeof o === "string" ? o : (o[state.lang] || o.it); }
  function c(k) { return COPY[state.lang][k]; }
  function alt() { return state.lang === "it" ? "en" : "it"; }

  /* ------------------------ struttura ------------------------ */

  var app = document.getElementById("app");
  app.innerHTML =
    '<div class="controls">' +
      '<span class="title">Bussola della Cittadinanza <small id="c-kicker"></small></span>' +
      '<div class="seg"><button class="ctl" id="lang-it">IT</button><button class="ctl" id="lang-en">EN</button></div>' +
      '<div class="seg"><button class="ctl" id="s-a3">A3</button><button class="ctl" id="s-a4">A4</button></div>' +
      '<div class="seg"><button class="ctl" id="z-fit"></button><button class="ctl" id="z-full"></button></div>' +
      '<button class="ctl primary" id="do-print"></button>' +
    "</div>" +
    '<p class="deskhint" id="hint"></p>' +
    '<div class="desk"><div class="scaler" id="scaler"><article class="poster" id="poster" data-size="a3"></article></div></div>';

  var poster = document.getElementById("poster");
  var scaler = document.getElementById("scaler");
  var pageStyle = document.createElement("style");
  document.head.appendChild(pageStyle);

  /* ------------------------ disegno ------------------------ */

  function render() {
    poster.innerHTML =
      '<header class="phead">' +
        '<div class="root">' +
          '<span class="kicker">' + c("kicker") + "</span>" +
          "<h1>" + L(byId.root.t) + "<span>" + byId.root.t[alt()] + "</span></h1>" +
        "</div>" +
        '<p class="blurb">' + c("blurb") + "</p>" +
        '<div class="statstrip">' + c("stats").map(function (s) {
          return '<div><span class="n">' + s[0] + '</span><span class="l">' + s[1] + "</span></div>";
        }).join("") + "</div>" +
      "</header>" +

      '<div class="map">' +
        '<div class="trunk"></div>' +
        '<div class="cols">' + branches.map(function (b, i) {
          return '<section class="col" style="--hue:var(--c' + (i + 1) + ')">' +
            '<div class="stem"></div>' +
            '<div class="hub"><span class="code">' + b.code + "</span>" +
              "<h2>" + L(b.t) + "</h2>" +
              '<span class="en">' + b.t[alt()] + "</span>" +
              '<p class="lead">' + L(b.lead) + "</p></div>" +
            '<ol class="leaves">' + (kids[b.id] || []).map(function (k) {
              return "<li><span class=\"code\">" + k.code + "</span> " +
                '<span class="it">' + L(k.t) + "</span>" +
                '<span class="en">' + k.t[alt()] + "</span></li>";
            }).join("") + "</ol>" +
          "</section>";
        }).join("") + "</div>" +
      "</div>" +

      '<footer class="facts">' +
        '<section class="timeline"><h3>' + c("tl") + "</h3>" +
          '<div class="tlrow">' + TIMELINE.slice(0, 9).map(tlCell).join("") + "</div>" +
          '<div class="tlrow">' + TIMELINE.slice(9).map(tlCell).join("") + "</div>" +
        "</section>" +
        FACTS.map(function (f) {
          return "<section><h3>" + L(f.h) + "</h3><dl>" + f.rows.map(function (r) {
            return "<dt>" + r[0] + "</dt><dd>" + L(r[1]) + "</dd>";
          }).join("") + "</dl></section>";
        }).join("") +
        '<div class="colophon"><span class="warn">' + c("warn") + "</span>" +
          '<span class="src">' + c("src") + "</span></div>" +
      "</footer>";
  }

  function tlCell(t) {
    return '<div><span class="y">' + t[0] + '</span><span class="e">' +
      (state.lang === "it" ? t[1] : t[2]) + "</span></div>";
  }

  /* ------------------------ comandi ------------------------ */

  function setSize(sz) {
    state.size = sz;
    poster.dataset.size = sz;
    pageStyle.textContent = "@page { size: " + (sz === "a3" ? "A3" : "A4") + " landscape; margin: 0; }";
    document.getElementById("s-a3").setAttribute("aria-pressed", String(sz === "a3"));
    document.getElementById("s-a4").setAttribute("aria-pressed", String(sz === "a4"));
    autofit();
    applyZoom();
  }

  // La stampa deve restare in una pagina anche con caratteri diversi da quelli
  // previsti: si parte da un corpo generoso e si scende finché tutto entra.
  function autofit() {
    var start = state.size === "a3" ? 3.4 : 2.4;
    var floor = state.size === "a3" ? 2.1 : 1.5;
    var cols = poster.querySelector(".cols");
    for (var f = start; f > floor; f -= 0.05) {
      poster.style.setProperty("--fs", f.toFixed(2) + "mm");
      void poster.offsetHeight;
      var tallest = 0;
      poster.querySelectorAll(".col").forEach(function (c) { tallest = Math.max(tallest, c.offsetHeight); });
      if (tallest <= cols.clientHeight && poster.scrollHeight <= poster.clientHeight) break;
    }
  }

  function applyZoom() {
    var w = poster.getBoundingClientRect().width / (scaler.dataset.k || 1);
    var natural = poster.offsetWidth;
    var avail = document.querySelector(".desk").clientWidth - 28;
    var k = state.zoom === "fit" ? Math.min(1, avail / natural) : 1;
    scaler.dataset.k = k;
    scaler.style.transform = "scale(" + k + ")";
    scaler.style.height = (poster.offsetHeight * k) + "px";
    document.getElementById("z-fit").setAttribute("aria-pressed", String(state.zoom === "fit"));
    document.getElementById("z-full").setAttribute("aria-pressed", String(state.zoom === "full"));
    void w;
  }

  function setLang(l) {
    state.lang = l;
    document.getElementById("lang-it").setAttribute("aria-pressed", String(l === "it"));
    document.getElementById("lang-en").setAttribute("aria-pressed", String(l === "en"));
    document.documentElement.lang = l;
    render();
    labels();
    autofit();
    applyZoom();
  }

  function labels() {
    document.getElementById("c-kicker").textContent = state.size === "a3" ? "A3 · 420 × 297 mm" : "A4 · 297 × 210 mm";
    document.getElementById("z-fit").textContent = c("fit");
    document.getElementById("z-full").textContent = c("full");
    document.getElementById("do-print").textContent = c("print");
    document.getElementById("hint").textContent = state.lang === "it"
      ? "Un solo foglio: tutte le 63 voci della mappa più i numeri e le date da ripasso. Stampa in orizzontale, senza margini e con la grafica di sfondo attiva."
      : "One sheet: all 63 entries of the map plus the numbers and dates to revise. Print landscape, borderless, with background graphics on.";
  }

  document.getElementById("lang-it").onclick = function () { setLang("it"); };
  document.getElementById("lang-en").onclick = function () { setLang("en"); };
  document.getElementById("s-a3").onclick = function () { setSize("a3"); labels(); };
  document.getElementById("s-a4").onclick = function () { setSize("a4"); labels(); };
  document.getElementById("z-fit").onclick = function () { state.zoom = "fit"; applyZoom(); };
  document.getElementById("z-full").onclick = function () { state.zoom = "full"; applyZoom(); };
  document.getElementById("do-print").onclick = function () { window.print(); };

  var rt;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(applyZoom, 150); });

  /* ------------------------- avvio ------------------------- */

  document.getElementById("lang-it").setAttribute("aria-pressed", String(state.lang === "it"));
  document.getElementById("lang-en").setAttribute("aria-pressed", String(state.lang === "en"));
  render();
  setSize("a3");
  labels();
  if (document.fonts) document.fonts.ready.then(function () { autofit(); applyZoom(); });
})();

</script>
